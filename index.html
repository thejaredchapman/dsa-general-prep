function DayPlan({ onDayClick }) {
  const todayNum = getTodayDayNum();
  const hasDayProblems = num => PROBLEMS.some(p => p.day === num);
  const todayData = todayNum ? DAYS.find(d => d.num === todayNum) : null;
  const [filterWeek, setFilterWeek] = useState(null);

  const numWeeks = Math.ceil(PLAN_LENGTH / 7);
  const allWeeks = Array.from({length: numWeeks}, (_, i) => i + 1);

  // Group DAYS by week number
  const grouped = {};
  DAYS.forEach(d => {
    const w = Math.ceil(d.num / 7);
    if (!grouped[w]) grouped[w] = [];
    grouped[w].push(d);
  });

  const weeksToShow = filterWeek === null ? allWeeks : [filterWeek];

  function DayCard({ day }) {
    const isToday = day.num === todayNum;
    const hasProbs = hasDayProblems(day.num);
    return (
      <div
        data-day={((day.num - 1) % 9) + 1}
        className={`day-card clickable${isToday ? ' today' : ''}`}
        onClick={() => hasProbs && onDayClick(day.num)}
        style={!hasProbs ? {cursor:'default'} : {}}
      >
        <div className="day-meta">
          <span className="day-num">Day {day.num}</span>
          <span className="day-date">{day.date}</span>
          {isToday ? (
            <span className="today-badge">
              <span className="today-dot" style={{background:'#fff',width:'6px',height:'6px'}} />
              Today
            </span>
          ) : (
            <span className="day-time">{dayHoursLabel(day)}</span>
          )}
        </div>
        <div className="day-title">{day.title}</div>
        <div className="topic-pills">
          {day.topics.map(t => <span key={t} className="topic-pill">{t}</span>)}
        </div>
        <div className="schedule-list">
          {day.schedule.map((s, i) => (
            <div key={i} className="sched-item">
              <span className="sched-period">{s.p}</span>
              <span className="sched-task">{s.t}</span>
              <span className="sched-dur">{s.d}</span>
            </div>
          ))}
        </div>
        {hasProbs && (
          <div className="view-probs-hint">
            View {PROBLEMS.filter(p => p.day === day.num).length} problem{PROBLEMS.filter(p => p.day === day.num).length > 1 ? 's' : ''} →
          </div>
        )}
      </div>
    );
  }

  return (
    <div>
      {todayData && (
        <div className="day-banner">
          <span className="today-dot" />
          <span className="day-banner-label">Day {todayData.num} of {PLAN_LENGTH}</span>
          <span style={{color:'#94a3b8'}}>—</span>
          <span className="day-banner-title">{todayData.title}</span>
          <span className="day-banner-date">{todayData.date}</span>
          <span className="day-time">{dayHoursLabel(todayData)}</span>
          {hasDayProblems(todayData.num) && (
            <button className="day-banner-link" onClick={() => onDayClick(todayData.num)}>
              {PROBLEMS.filter(p => p.day === todayData.num).length} problems →
            </button>
          )}
        </div>
      )}

      {/* Week filter — always show for any plan length */}
      <div className="week-phase-bar">
        <button className={`phase-btn${filterWeek===null?' active-phase':''}`} onClick={() => setFilterWeek(null)}>
          All {PLAN_LENGTH} days
        </button>
        {allWeeks.map(w => (
          <button key={w} className={`phase-btn${filterWeek===w?' active-phase':''}`} onClick={() => setFilterWeek(w)}>
            W{w}
          </button>
        ))}
      </div>

      {/* Days grouped by week with phase labels */}
      {weeksToShow.map(w => {
        const days = grouped[w];
        if (!days || days.length === 0) return null;
        const startDay = (w - 1) * 7 + 1;
        const endDay = Math.min(w * 7, PLAN_LENGTH);
        const phase = WEEK_PHASE_NAMES[w - 1] || `Week ${w}`;
        return (
          <div key={w}>
            <div className="week-label">
              Week {w} — {phase} &nbsp;·&nbsp; Days {startDay}–{endDay}
            </div>
            <div className="grid-3" style={{marginBottom:'8px'}}>
              {days.map(day => <DayCard key={day.num} day={day} />)}
            </div>
          </div>
        );
      })}
    </div>
  );
}

  { num:4, title:'Interleaving', tag:'Core Learning',
    body:'Doing 10 two-pointer problems in a row feels productive but trains pattern-matching on a single signal. Real interviews mix patterns. After Day 7, every study session should include at least 2 different patterns — even if one is review. This forces the harder skill: pattern identification.',
    tip:'On review days, pick one problem from 3 different categories. Don\'t let yourself know the pattern before reading the problem. The question "which pattern is this?" is the real interview skill.' },
  { num:5, title:'Elaborative Interrogation', tag:'Core Learning',
    body:'When you learn a new algorithm, don\'t just ask "what does this do?" — ask "WHY does this work?" and "WHY is this faster than the alternative?" Understanding the proof, not just the code, is what lets you adapt when interviewers change the constraints.',
    tip:'For every pattern in the Patterns tab, after reading the code, close it and explain the WHY in writing. "The sliding window is O(n) because each element enters and exits the window exactly once..." That sentence is more valuable than the code.' },

  // ── Deep Work ──────────────────────────────────
  { num:6, title:'Time Blocking', tag:'Deep Work',
    body:'Open-ended "I\'ll study today" sessions drift. Blocked sessions — 9am–10:30am, no exceptions — get done. The cognitive transition into focused work takes ~15 minutes; a vague study session often ends before real thinking begins. Block like a meeting you can\'t cancel.',
    tip:'Match the block to the schedule. Morning: new patterns (highest cognitive demand). Midday: problems (active application). Afternoon: review/mock. Evening: flashcards (low demand). Don\'t invert this — you won\'t learn hard concepts on a tired brain.' },
  { num:7, title:'Environment Design', tag:'Deep Work',
    body:'Willpower is finite. A phone on the desk cuts deep work capacity even when untouched, because the anticipation of interruption occupies cognitive resources. Design the environment so willpower isn\'t needed: phone in another room, notifications off, one tab open, door closed.',
    tip:'Before every session: phone away, IDE open to a blank file, browser closed except the prep app. Write your session goal on paper: "Today: implement BFS iterative from scratch + solve 2 graph problems." Read it when you get distracted.' },
  { num:8, title:'Pre-Session Ritual', tag:'Deep Work',
    body:'The same 5-minute warm-up sequence before every session trains your brain to enter a focused state on cue — the same way athletes warm up. Consistency matters more than the specific ritual. It removes the cold-start friction that kills 20-minute sessions.',
    tip:'Try: (1) Write today\'s goal. (2) Review yesterday\'s mistake log. (3) Write one pattern template from memory. (4) Start the Pomodoro timer. Total: 5 minutes. Do this before every single session.' },
  { num:9, title:'Pomodoro for DS&A', tag:'Deep Work',
    body:'The built-in Pomodoro timer (bottom-left) is calibrated for this plan. Use 25-minute work blocks for new concept learning and 45-minute blocks for problem-solving (problems need the first 10 minutes to understand the problem before the solution becomes accessible).',
    tip:'Never stop a Pomodoro mid-problem. If the timer ends, note exactly where you are and restart. Fragmented problem sessions are the main cause of "I never finish anything."' },

  // ── DS&A Specific ──────────────────────────────
  { num:10, title:'Implement From Scratch Daily', tag:'DS&A Retention',
    body:'Reading code and understanding it activates recognition memory. Writing it activates recall memory. Recognition is useless in an interview. At the start of every session, pick one template from the Reference tab and type it into a blank editor from memory. No peeking. Check after.',
    tip:'Target: by Week 4 (Day 28), you should be able to implement all 7 core templates in under 10 minutes total, from memory. Test yourself on Day 7, 14, 21, 28. Time it.' },
  { num:11, title:'Pattern Journal', tag:'DS&A Retention',
    body:'After every problem you attempt — whether you solved it or not — write three things: (1) the pattern name, (2) the key insight that makes the optimal solution work, (3) the mistake you made or almost made. This takes 3 minutes. Over 30 days it becomes a personalized problem guide.',
    tip:'Keep it in a notes app, not your head. Before each mock, re-read only your pattern journal from the last 7 days. You\'ll catch your most likely interview mistakes before they happen.' },
  { num:12, title:'Error Log', tag:'DS&A Retention',
    body:'Every bug you hit during practice is data. Track: off-by-one errors, forgotten edge cases, wrong complexity analysis, wrong pattern choice. Review your error log every Sunday. Patterns in your errors reveal your actual gaps, not the gaps you assume you have.',
    tip:'Don\'t delete solved errors. Mark them "resolved" but keep reading them. If the same error appears twice it means you understood the fix but didn\'t change the habit. The fix is deliberate repetition, not re-reading.' },
  { num:13, title:'Trace by Hand', tag:'DS&A Retention',
    body:'Drawing the state of your data structure at each step is not just for debugging. It builds the mental model that lets you write code without running it. For trees: draw the nodes and edges. For sliding windows: draw the indices. For graphs: draw the adjacency. Do this for every new pattern.',
    tip:'During mocks: always draw your example before writing code. This is part of the interview ritual (step 3). It also gives the interviewer something to engage with, making the session more collaborative.' },

  // ── Energy & Cognitive Load ─────────────────────
  { num:14, title:'Sleep is Non-Negotiable', tag:'Energy & Memory',
    body:'Memory consolidation happens during sleep, specifically during slow-wave and REM sleep. A night of 5 hours after learning something will lose significantly more of it than 8 hours. This is not soft advice — it is a neurological fact. Pulling a late-night study session the night before a mock costs more than it gains.',
    tip:'Schedule hard concepts in the morning after a full sleep. The last thing you do before sleep has elevated consolidation. Use your flashcard evening drill specifically because of this: those 5-10 concepts will consolidate overnight.' },
  { num:15, title:'Single-Tasking', tag:'Energy & Memory',
    body:'Context-switching between two algorithms halves your learning rate for both. Don\'t half-learn binary search while also reviewing DFS. Complete one thing — understand it, implement it, test it — before opening anything else. Depth on one topic beats breadth on three.',
    tip:'If you catch yourself switching topics mid-session, stop. Write a note: "Come back to X tomorrow." Stay on the original task. The unfinished second topic will be waiting, and you\'ll learn both better by finishing one fully.' },
  { num:16, title:'Chunk Progressively', tag:'Energy & Memory',
    body:'For every new pattern: First understand the idea (no code). Then study the template (no problems). Then apply it to an easy problem. Then medium. Then hard. Jumping to a hard problem before internalizing the template guarantees frustration and shallow learning.',
    tip:'The daily schedule already follows this order. Morning = idea + template. Midday = application. Don\'t skip the morning step because you\'re impatient to practice. The template session is the most important 45 minutes of the day.' },

  { num:17, title:'Desensitize to Pressure', tag:'Interview Prep',
    body:'Interview performance anxiety is a conditioned response to the observation context — specifically, the feeling of being watched while trying to think. The cure is repeated exposure. Code in front of someone. Use a mock interview platform. Record yourself on video. Your first few sessions will feel terrible; that\'s the process working.',
    tip:'Once per week (starting Week 5), do a mock where someone is watching. If alone, set up a camera and record yourself. Play it back and watch it. Your verbal habits and silence patterns will be immediately visible and correctible.' },
  { num:18, title:'Build Comfort Phrases', tag:'Interview Prep',
    body:'Silence in an interview reads as stuck. Narrating while thinking — even imperfectly — keeps the interviewer engaged and buys time. Build a small repertoire of phrases you say automatically: "Let me think through the brute force first." "I see a few approaches, let me compare them." "Before I code, let me trace through this example."',
    tip:'Pick 3 phrases. Write them on a sticky note. Say them out loud 10 times right now. Say them before every mock. After two weeks they\'ll be automatic — you\'ll say them under pressure without thinking, which is exactly when you need them.' },
  { num:19, title:'Failure Review Protocol', tag:'Interview Prep',
    body:'Problems you got wrong are more valuable than problems you got right. Don\'t move on after a wrong attempt — mine it. Ask: Was it a pattern recognition failure? An implementation bug? A missing edge case? Wrong complexity analysis? The answer tells you exactly what to drill. Avoiding hard problems is the main reason people plateau.',

const FC_FILTERS = ['All','Arrays','Trees','Graphs','DP','Advanced','Strings','Complexity','Design','Misc'];

function Flashcards() {
  const [filter, setFilter] = useState('All');
  const [idx, setIdx] = useState(0);
  const [flipped, setFlipped] = useState(false);

  const filtered = filter === 'All' ? FLASHCARDS : FLASHCARDS.filter(c => c.tag === filter.toLowerCase());
  const card = filtered[Math.min(idx, filtered.length - 1)];

  function changeFilter(f) { setFilter(f); setIdx(0); setFlipped(false); }
  function prev() { setIdx(i => Math.max(0, i-1)); setFlipped(false); }
  function next() { setIdx(i => Math.min(filtered.length-1, i+1)); setFlipped(false); }
  function flip() { setFlipped(f => !f); }

  if (!card) return <p style={{color:'var(--muted)'}}>No cards match this filter.</p>;

  const cur = Math.min(idx, filtered.length - 1);

  return (
    <div className="flashcard-area">
      <div className="filter-bar">
        {FC_FILTERS.map(f => (
          <button key={f} className={`filter-btn${filter===f?' active':''}`} onClick={() => changeFilter(f)}>{f}</button>
        ))}
      </div>

      <div className="flashcard-wrapper" onClick={flip}>
        <div className={`flashcard-inner${flipped ? ' flipped' : ''}`}>
          {/* FRONT */}
          <div className="fc-face">
            <div className="fc-label-row">
              <span className="badge badge-pat">{card.label}</span>
              <span style={{fontSize:'11px', color:'var(--muted)'}}>tap to flip</span>
            </div>
            <div className="fc-q">{card.q}</div>
            <div className="fc-hint">↕ click anywhere to reveal answer</div>
          </div>
          {/* BACK */}
          <div className="fc-face fc-back-face">
            <div className="fc-label-row">
              <span className="badge badge-pat">{card.label}</span>
              <span style={{fontSize:'11px', color:'var(--muted)'}}>tap to flip back</span>
            </div>
            <div className="fc-a">{card.a}</div>
          </div>
        </div>
      </div>

      <div className="fc-nav">
        <button className="nav-btn" onClick={prev} disabled={cur === 0}>← Prev</button>
        <span className="card-counter">{cur+1} / {filtered.length}</span>
        <button className="nav-btn" onClick={next} disabled={cur === filtered.length-1}>Next →</button>
      </div>
    </div>
  );
}

function Problems({ filter, setFilter }) {
  const [completedMap, setCompletedMap] = useState(getCompletedProblems);

  function refreshDone() { setCompletedMap(getCompletedProblems()); }

  // Only show problems relevant to the current plan length
  const planProblems = PROBLEMS.filter(p => !p.day || p.day <= PLAN_LENGTH);
  // Also filter the day filter buttons to only show days in scope
  const planDayFilters = PROB_DAY_FILTERS.filter(d => d <= PLAN_LENGTH);

  const isDayFilter = filter.startsWith('day:');
  const dayNum = isDayFilter ? parseInt(filter.split(':')[1]) : null;

  const visible = planProblems.filter(p => {
    if (filter === 'All') return true;
    if (isDayFilter) return p.day === dayNum;
    return p.tags.includes(filter.toLowerCase());
  });

  const dayInfo = isDayFilter ? DAYS.find(d => d.num === dayNum) : null;
  const totalDone = planProblems.filter(p => completedMap[p.id]).length;
  const visibleDone = visible.filter(p => completedMap[p.id]).length;
  const pct = planProblems.length > 0 ? Math.round((totalDone / planProblems.length) * 100) : 0;

  return (
    <div onClick={refreshDone}>
      <div className="prob-progress">
        <span className="prob-progress-text">{totalDone} / {planProblems.length} problems completed ({PLAN_LENGTH}-day plan)</span>
        <div className="prob-progress-bar-wrap">
          <div className="prob-progress-bar-fill" style={{width:`${pct}%`}} />
        </div>
        <span style={{fontSize:'12px',color:'#059669',fontWeight:'600'}}>{pct}%</span>
        {visibleDone > 0 && filter !== 'All' && (
          <span style={{fontSize:'12px',color:'var(--muted)'}}>{visibleDone}/{visible.length} shown</span>
        )}
      </div>
      <div className="filter-bar" style={{marginBottom:'8px'}}>
        {PROB_FILTERS.map(f => (
          <button key={f} className={`filter-btn${filter===f?' active':''}`} onClick={() => setFilter(f)}>{f}</button>
        ))}
      </div>
      <div className="filter-bar" style={{marginBottom:'20px', paddingLeft:'2px'}}>
        <span style={{fontSize:'11px',fontWeight:'600',textTransform:'uppercase',letterSpacing:'.07em',color:'var(--muted)',display:'flex',alignItems:'center',paddingRight:'4px'}}>By Day</span>
        {planDayFilters.map(n => {
          const key = `day:${n}`;
          return (
            <button key={n} className={`filter-btn${filter===key?' active':''}`} onClick={() => setFilter(key)}>
              Day {n}
            </button>
          );
        })}
      </div>
      {dayInfo && (
        <div style={{display:'flex',alignItems:'center',gap:'10px',marginBottom:'16px',paddingBottom:'14px',borderBottom:'1px solid #e5e5e5'}}>
          <span style={{fontSize:'12px',fontWeight:'700',textTransform:'uppercase',letterSpacing:'.08em',color:'var(--muted)'}}>Day {dayInfo.num} · {dayInfo.date}</span>
          <span style={{fontSize:'15px',fontWeight:'600',color:'#111827'}}>{dayInfo.title}</span>
          <div style={{display:'flex',gap:'5px',flexWrap:'wrap'}}>
            {dayInfo.topics.map(t => <span key={t} className="topic-pill">{t}</span>)}
          </div>
        </div>
      )}
      {visible.length === 0
        ? <p style={{color:'var(--muted)'}}>No problems match this filter.</p>
        : visible.map(p => <ProblemCard key={p.id} p={p} />)
      }
    </div>
  );
}

let _pyodide = null;
let _pyodideLoading = null;
const PYODIDE_CDN = 'https://cdn.jsdelivr.net/pyodide/v0.26.0/full/';

async function getPyodide() {
  if (_pyodide) return _pyodide;
  if (_pyodideLoading) return _pyodideLoading;
  if (!window.WebAssembly) throw new Error('WebAssembly is not available in your browser.\nTry Chrome 89+, Firefox 89+, or Safari 15+.');
  _pyodideLoading = (async () => {
    if (!window.loadPyodide) {
      await new Promise((res, rej) => {
        const s = document.createElement('script');
        s.src = PYODIDE_CDN + 'pyodide.js';
        s.crossOrigin = 'anonymous';
        s.onload = res;
        s.onerror = () => rej(new Error('Could not download Python runtime from CDN.\nCheck your internet connection and try again.'));
        document.head.appendChild(s);
      });
    }
    const py = await window.loadPyodide({ indexURL: PYODIDE_CDN });
    await py.loadPackagesFromImports('import heapq, bisect, collections, functools, itertools, math');
    _pyodide = py; _pyodideLoading = null; return py;
  })();
  _pyodideLoading.catch(() => { _pyodideLoading = null; });
  return _pyodideLoading;
}

function runUserCode(py, userCode) {
  // Pass code as a Python variable — no escaping needed.
  // exec() without second arg runs in the current global scope,
  // so user's functions persist in py.globals and auto-tests can call them.
  py.globals.set('_user_code', userCode);
  py.runPython(`
import sys, io, traceback as _tb
_cap_out = io.StringIO(); _cap_err = io.StringIO()
_old_out, _old_err = sys.stdout, sys.stderr
sys.stdout = _cap_out; sys.stderr = _cap_err
_exec_error = None
try:
    exec(_user_code)
except Exception:
    _exec_error = _tb.format_exc()
finally:
    sys.stdout = _old_out; sys.stderr = _old_err
_result_out = _cap_out.getvalue(); _result_err = _cap_err.getvalue()
`);
  const out = py.globals.get('_result_out') || '';
  const err = py.globals.get('_result_err') || '';
  const exc = py.globals.get('_exec_error');
  return { out, err: err + (exc || ''), hasError: Boolean(exc) };
}

function CodeRunner({ problem }) {
  const [code, setCode] = useState(() => getStarterCode(problem.id, problem.title));
  const [output, setOutput] = useState(null);
  const [testResults, setTestResults] = useState(null);
  const [status, setStatus] = useState('idle');

  function handleKeyDown(e) {
    if (e.key === 'Tab') {
      e.preventDefault();
      const s = e.target.selectionStart, end = e.target.selectionEnd;
      setCode(c => c.substring(0, s) + '    ' + c.substring(end));
      requestAnimationFrame(() => { e.target.selectionStart = e.target.selectionEnd = s + 4; });
    }
  }

  async function runCode() {
    if (status === 'loading' || status === 'running') return;
    setOutput(null); setTestResults(null); setStatus('loading');
    let py;
    try { py = await getPyodide(); } catch(e) {
      setOutput({ err: true, text: String(e.message || e) });
      setStatus('done'); return;
    }
    setStatus('running');
    const { out, err, hasError } = runUserCode(py, code);
    if (hasError) {
      setOutput({ err: true, text: err || out });
    } else {
      setOutput({ err: Boolean(err), text: (out || '(no output — add a print() call)') + (err ? '\n\n' + err : '') });
      const tests = AUTO_TESTS[problem.id];
      if (tests) {
        const res = tests.map(t => {
          try {
            const got = String(py.runPython(`str(${t.call})`));
            return { call: t.call, exp: t.exp, got, pass: got === t.exp };
          } catch(e) {
            const lines = String(e.message || e).trim().split('\n');
            return { call: t.call, exp: t.exp, got: lines[lines.length-1] || 'Error', pass: false };
          }
        });
        setTestResults(res);
      }
    }
    setStatus('done');
  }

  const passing = testResults ? testResults.filter(r => r.pass).length : 0;
  return (
    <div className="code-editor-wrap">
      <textarea className="code-editor" value={code} onChange={e => setCode(e.target.value)} onKeyDown={handleKeyDown} spellCheck={false} placeholder="Write your Python solution here..." />
      <div className="code-run-row">
        <button className="code-run-btn" onClick={runCode} disabled={status==='loading'||status==='running'}>
          {status==='loading'?'⏳ Loading Python…':status==='running'?'⏳ Running…':'▶ Run Python'}
        </button>
        <button className="code-reset-btn" onClick={() => { setCode(getStarterCode(problem.id,problem.title)); setOutput(null); setTestResults(null); setStatus('idle'); }}>Reset</button>
        {status==='loading' && <span className="code-pyodide-note">First run: ~10MB Python download (cached after)</span>}
      </div>
      {output && <div className={`code-output${output.err?' error':''}`}>{output.text}</div>}
      {testResults && testResults.length > 0 && (
        <div className="code-tests">
          <div className="code-tests-header">Auto-tests — {passing}/{testResults.length} passing{passing===testResults.length?' ✓ All pass!':''}</div>
          {testResults.map((r,i) => (
            <div key={i} className={`code-test-row ${r.pass?'pass':'fail'}`}>
              <span className="code-test-icon">{r.pass?'✓':'✗'}</span>
              <span className="code-test-call">{r.call}</span>
              <span className="code-test-result">{r.pass?`→ ${r.got}`:`got: ${r.got}  want: ${r.exp}`}</span>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

function MockTimer() {
  const TOTAL = 45 * 60;
  const [selected, setSelected] = useState(null);
  const [diffFilter, setDiffFilter] = useState('All');
  const [timeLeft, setTimeLeft] = useState(TOTAL);
  const [running, setRunning] = useState(false);
  const [done, setDone] = useState(false);
  const ivRef = useRef(null);

  useEffect(() => {
    if (running) {
      ivRef.current = setInterval(() => {
        setTimeLeft(t => {
          if (t <= 1) {
            clearInterval(ivRef.current);
            setRunning(false);
            setDone(true);
            return 0;
          }
          return t - 1;
        });
      }, 1000);
    } else {
      clearInterval(ivRef.current);
    }
    return () => clearInterval(ivRef.current);
  }, [running]);

  function reset() { clearInterval(ivRef.current); setRunning(false); setDone(false); setTimeLeft(TOTAL); }

  const mins = Math.floor(timeLeft / 60);
  const secs = timeLeft % 60;
  const timerStr = `${pad(mins)}:${pad(secs)}`;
  const timerClass = done ? 'timer-disp done' : timeLeft <= 5*60 ? 'timer-disp danger' : timeLeft <= 10*60 ? 'timer-disp warn' : 'timer-disp';
  const alert = done ? "Time's up! State your Big O." : timeLeft <= 5*60 ? '5 min left — trace your solution!' : timeLeft <= 10*60 ? '10 min left — start wrapping up.' : '';
  const alertClass = timeLeft <= 5*60 ? 'timer-alert danger' : 'timer-alert';

  const DIFF_COLORS = { All:'#374151', Easy:'#27500A', Medium:'#633806', Hard:'#791F1F' };
  const DIFF_BG    = { All:'#fff',    Easy:'#EAF3DE', Medium:'#FAEEDA',  Hard:'#FCEBEB' };

  // Only show problems in scope for current plan length
  const planProblems = PROBLEMS.filter(p => !p.day || p.day <= PLAN_LENGTH);
  const filteredProblems = diffFilter === 'All' ? planProblems : planProblems.filter(p => p.diff === diffFilter.toLowerCase());
  const selectedProblem = selected ? PROBLEMS.find(p => p.id === selected) : null;

  return (
    <div>
      {/* Difficulty filter */}
      <div style={{display:'flex',gap:'8px',marginBottom:'12px',alignItems:'center',flexWrap:'wrap'}}>
        <span style={{fontSize:'11px',fontWeight:'700',textTransform:'uppercase',letterSpacing:'.07em',color:'var(--muted)'}}>Difficulty:</span>
        {['All','Easy','Medium','Hard'].map(d => (
          <button key={d} onClick={() => setDiffFilter(d)}
            style={{
              padding:'5px 14px', borderRadius:'100px', border:'1px solid',
              borderColor: diffFilter===d ? DIFF_COLORS[d] : '#e5e5e5',
              background: diffFilter===d ? DIFF_BG[d] : '#fff',
              color: diffFilter===d ? DIFF_COLORS[d] : '#6b7280',
              cursor:'pointer', fontSize:'12.5px', fontWeight:'600', fontFamily:'inherit',
              transition:'all .15s',
            }}
          >{d}</button>
        ))}
        <span style={{marginLeft:'auto',fontSize:'12px',color:'var(--muted)'}}>{filteredProblems.length} problem{filteredProblems.length!==1?'s':''}</span>
      </div>

      {/* Problem grid */}
      <div className="mock-grid">
        {filteredProblems.map(p => (
          <div key={p.id} className={`mock-card${selected===p.id?' selected':''}`}
            onClick={() => setSelected(id => id===p.id ? null : p.id)}>
            <div className="mock-title">{p.title}</div>
            <div style={{display:'flex',gap:'6px',alignItems:'center',marginTop:'4px'}}>
              <Badge diff={p.diff} />
              <span className="mock-pat">{p.pat}</span>
            </div>
          </div>
        ))}
      </div>

      {/* Problem statement panel */}
      {selectedProblem
        ? <ProblemPanel problem={selectedProblem} />
        : <div className="mock-no-problem">← Select a problem above to see the full statement, examples, and constraints.</div>
      }

      {/* Timer */}
      <div className="timer-wrap">
        <div className={timerClass}>{timerStr}</div>
        <div className={alertClass}>{alert}</div>
      </div>
      <div className="timer-ctrls">
        {!running && !done && <button className="t-btn primary" onClick={() => setRunning(true)}>Start</button>}
        {running && <button className="t-btn" onClick={() => setRunning(false)}>Pause</button>}
        {!running && done && <button className="t-btn primary" onClick={reset}>Start New Mock</button>}
        {(running || (!done && timeLeft < TOTAL)) && <button className="t-btn" onClick={reset}>Reset</button>}
      </div>

      {/* Protocol */}
      <div className="protocol-card">
        <div className="protocol-title">Mock Protocol</div>
        {[
          {t:'0–5 min',d:'Clarify inputs, outputs, constraints, edge cases — do not write code yet.'},
          {t:'5–10 min',d:'State a brute force approach out loud and its complexity.'},
          {t:'10–30 min',d:'Code the optimized solution, narrating every line.'},
          {t:'30–40 min',d:'Trace through a concrete example to verify.'},
          {t:'40–45 min',d:'State Big O time and space, discuss edge cases.'},
        ].map(item => (
          <div key={item.t} className="p-item">
            <span className="p-time">{item.t}</span>
            <span className="p-desc">{item.d}</span>
          </div>
        ))}
      </div>
    </div>
  );
}

              {cat:'Structural',desc:'Composing objects',items:['Adapter — wrap incompatible interface','Decorator — add behavior at runtime','Composite — treat items and collections uniformly','Facade — simplified interface to a subsystem','Proxy — surrogate that controls access']},
              {cat:'Behavioral',desc:'Object communication',items:['Observer — pub/sub, event systems','Strategy — swap algorithms at runtime','Iterator — traverse without exposing internals','Command — encapsulate request as object (undo/redo)','Template Method — skeleton in base, steps in subclass','State — change behavior when state changes']},

class Singleton:
    _instance = None
    def __new__(cls):
        if not cls._instance:
            cls._instance = super().__new__(cls)
        return cls._instance

# Strategy — swap algorithms at runtime
class Sorter:
    def __init__(self, strategy): self.strategy = strategy
    def sort(self, data): return self.strategy(data)

sorter = Sorter(sorted)                # inject any callable
sorter = Sorter(lambda d: sorted(d, reverse=True))

# Observer
class EventEmitter:
    def __init__(self): self._listeners = {}
    def on(self, event, fn): self._listeners.setdefault(event, []).append(fn)
    def emit(self, event, *args):
        for fn in self._listeners.get(event, []): fn(*args)

# Decorator (Python built-in pattern)
def logging_decorator(func):
    def wrapper(*args, **kwargs):

        return func(*args, **kwargs)

const ST_MIN = 15 * 60;
const ST_MAX = 120 * 60;
const ST_STEP = 15 * 60;
const ST_DEFAULT = 45 * 60;

function SideTimer() {
  const [preset, setPreset] = useState(ST_DEFAULT);
  const [timeLeft, setTimeLeft] = useState(ST_DEFAULT);
  const [running, setRunning] = useState(false);
  const [done, setDone] = useState(false);
  const [expanded, setExpanded] = useState(false);
  const [customMins, setCustomMins] = useState('');
  const ivRef = useRef(null);

  useEffect(() => {
    if (running) {
      ivRef.current = setInterval(() => {
        setTimeLeft(t => {
          if (t <= 1) { clearInterval(ivRef.current); setRunning(false); setDone(true); return 0; }
          return t - 1;
        });
      }, 1000);
    } else { clearInterval(ivRef.current); }
    return () => clearInterval(ivRef.current);
  }, [running]);

  function changePreset(delta) {
    const next = Math.min(ST_MAX, Math.max(ST_MIN, preset + delta));
    setPreset(next);
    if (!running) { setTimeLeft(next); setDone(false); }
  }

  function applyCustom() {
    const m = parseInt(customMins, 10);
    if (m > 0 && m <= 180) {
      const secs = m * 60;
      setPreset(secs);
      if (!running) { setTimeLeft(secs); setDone(false); }
    }
    setCustomMins('');
  }

  function reset() {
    clearInterval(ivRef.current);
    setRunning(false); setDone(false); setTimeLeft(preset);
  }

  const mins = pad(Math.floor(timeLeft / 60));
  const secs = pad(timeLeft % 60);
  const presetMins = Math.round(preset / 60);
  const colClass = done ? 'done' : running ? 'running' : '';

  if (!expanded) {
    return (
      <div className="side-timer" onClick={() => setExpanded(true)} title="Click to expand timer">
        <div className={`st-collapsed-time ${colClass}`}>{mins}:{secs}</div>
        <div className="st-collapsed-hint">{running ? '▶ on' : done ? 'done' : 'timer'}</div>
      </div>
    );
  }

  return (
    <div className="side-timer expanded" onClick={e => e.stopPropagation()}>
      <div className="st-exp-header">
        <span className="st-exp-title">Timer</span>
        <button className="st-close" onClick={() => setExpanded(false)}>×</button>
      </div>
      <div className={`st-big-time ${colClass}`}>{mins}:{secs}</div>
      <div className="st-status">{running ? 'Running' : done ? 'Done!' : `${presetMins}m set`}</div>
      <div className="st-incr-row">
        <button className="st-incr-btn" onClick={() => changePreset(-ST_STEP)} disabled={preset <= ST_MIN}>−15m</button>
        <button className="st-incr-btn" onClick={() => changePreset(ST_STEP)} disabled={preset >= ST_MAX}>+15m</button>
      </div>
      <div className="st-custom-row">
        <input className="st-custom-input" type="number" min="1" max="180" placeholder="min"
          value={customMins} onChange={e => setCustomMins(e.target.value)}
          onKeyDown={e => e.key === 'Enter' && applyCustom()} />
        <button className="st-incr-btn" style={{flex:'none',padding:'5px 8px'}} onClick={applyCustom}>Set</button>
      </div>
      <div className="st-ctrl-row">
        <button className="st-ctrl go" onClick={() => { if (done) reset(); else setRunning(r => !r); }}>
          {done ? '↺' : running ? '‖' : '▶'}
        </button>
        <button className="st-ctrl" onClick={reset}>↺</button>
      </div>
    </div>
  );
}
