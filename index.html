<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>DS&amp;A Interview Prep — 30-Day Professional Guide</title>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --border: 1px solid #e5e5e5;
      --radius: 8px;
      --easy-bg: #EAF3DE; --easy-text: #27500A;
      --med-bg: #FAEEDA; --med-text: #633806;
      --hard-bg: #FCEBEB; --hard-text: #791F1F;
      --pat-bg: #EEEDFE; --pat-text: #3C3489;
      --blue: #2563EB;
      --muted: #6b7280;
      --code-bg: #f4f4f5;
    }
    html { scroll-behavior: smooth; }
    body { font-family: 'Inter', -apple-system, sans-serif; background: #f9fafb; color: #111827; min-height: 100vh; }

    /* ── COUNTDOWN ───────────────────────────────── */
    .countdown-bar {
      background: #fff; border-bottom: var(--border);
      padding: 14px 20px 12px; text-align: center;
      position: sticky; top: 0; z-index: 200;
    }
    .countdown-label { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin-bottom: 4px; }
    .countdown-time { font-family: 'Fira Code', monospace; font-size: clamp(18px,4vw,30px); font-weight: 600; letter-spacing: .04em; color: #111827; }
    .countdown-msg { font-size: 13px; color: var(--muted); margin-top: 5px; font-style: italic; }
    /* reset panel */
    .reset-toggle { background: none; border: none; cursor: pointer; font-size: 11px; color: var(--muted); text-decoration: underline; margin-top: 6px; display: inline-block; font-family: inherit; }
    .reset-toggle:hover { color: var(--blue); }
    .reset-panel { display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 10px; padding-top: 10px; border-top: var(--border); flex-wrap: wrap; }
    .reset-input { padding: 5px 10px; border: var(--border); border-radius: 5px; font-size: 12px; font-family: inherit; }
    .reset-btn { padding: 5px 12px; border-radius: 5px; border: var(--border); background: #fff; cursor: pointer; font-size: 12px; font-weight: 600; font-family: inherit; }
    .reset-btn.primary { background: var(--blue); color: #fff; border-color: var(--blue); }
    .reset-btn:hover:not(.primary) { background: #f5f5f5; }
    /* email buttons */
    .email-bar { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin-top: 16px; }
    .email-btn { display: flex; align-items: center; gap: 6px; padding: 8px 14px; border: var(--border); border-radius: 6px; background: #fff; cursor: pointer; font-size: 12.5px; font-weight: 600; color: #374151; font-family: inherit; transition: border-color .12s, background .12s; }
    .email-btn:hover { border-color: var(--blue); color: var(--blue); }
    .email-btn.copied { background: #ECFDF5; color: #059669; border-color: #A7F3D0; }
    /* day time badge */
    .day-time { font-size: 11px; font-weight: 600; background: #F3F4F6; color: var(--muted); padding: 2px 7px; border-radius: 100px; white-space: nowrap; }

    /* ── TABS ────────────────────────────────────── */
    .tab-nav {
      display: flex; background: #fff; border-bottom: var(--border);
      overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none;
      position: sticky; top: 0; z-index: 190;
    }
    /* ── BIG O ───────────────────────────────────── */
    .bigo-complexity-table { width:100%; border-collapse:collapse; font-size:12px; background:#fff; border:var(--border); border-radius:var(--radius); overflow:hidden; margin-bottom:8px; }
    .bigo-complexity-table th { padding:8px 12px; text-align:left; font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:.07em; color:var(--muted); background:#f9fafb; border-bottom:var(--border); white-space:nowrap; }
    .bigo-complexity-table td { padding:8px 12px; border-bottom:var(--border); vertical-align:middle; }
    .bigo-complexity-table tr:last-child td { border-bottom:none; }
    .bigo-complexity-table td:nth-child(2) { font-family:'Fira Code',monospace; font-size:11.5px; font-weight:700; }
    .bigo-complexity-table td:nth-child(n+3) { font-family:'Fira Code',monospace; font-size:11px; color:#374151; }
    .bigo-chip { display:inline-block; font-family:'Fira Code',monospace; font-size:11.5px; font-weight:700; padding:2px 8px; border-radius:4px; }
    .bigo-card { background:#fff; border:var(--border); border-radius:var(--radius); margin-bottom:10px; overflow:hidden; }
    .bigo-header { display:flex; align-items:flex-start; gap:12px; padding:14px 18px; cursor:pointer; user-select:none; }
    .bigo-header:hover { background:#fafafa; }
    .bigo-header-left { flex:1; }
    .bigo-title-row { display:flex; align-items:center; gap:10px; margin-bottom:4px; flex-wrap:wrap; }
    .bigo-name { font-size:15px; font-weight:700; color:#111827; }
    .bigo-scale { font-size:12px; color:var(--muted); }
    .bigo-n1000 { font-family:'Fira Code',monospace; font-size:11px; background:#f3f4f6; color:#374151; padding:2px 7px; border-radius:3px; }
    .bigo-body { padding:0 18px 18px; border-top:var(--border); }
    .bigo-desc { font-size:13.5px; color:#374151; line-height:1.65; margin:12px 0 10px; }
    .bigo-examples { display:flex; flex-wrap:wrap; gap:5px; margin-bottom:12px; }
    .bigo-example-pill { font-family:'Fira Code',monospace; font-size:11.5px; background:var(--code-bg); color:#374151; padding:3px 8px; border-radius:3px; }
    .bigo-rules-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:10px; margin-bottom:8px; }
    .bigo-rule { background:#fff; border:var(--border); border-radius:var(--radius); padding:14px 16px; }
    .bigo-rule-title { font-size:13px; font-weight:700; color:#111827; margin-bottom:6px; }
    .bigo-rule-body { font-size:12.5px; color:#4b5563; line-height:1.6; }
    .bigo-rule-example { font-family:'Fira Code',monospace; font-size:11.5px; background:var(--code-bg); color:#374151; padding:4px 8px; border-radius:3px; margin-top:8px; white-space:pre; overflow-x:auto; display:block; }
    .bigo-ds-table { width:100%; border-collapse:collapse; font-size:12.5px; background:#fff; }
    .bigo-ds-table th { padding:7px 14px; text-align:left; font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:.07em; color:var(--muted); background:#f9fafb; border-bottom:var(--border); }
    .bigo-ds-table td { padding:8px 14px; border-bottom:var(--border); }
    .bigo-ds-table tr:last-child td { border-bottom:none; }
    .bigo-ds-table td:nth-child(2), .bigo-ds-table td:nth-child(3) { font-family:'Fira Code',monospace; font-size:11.5px; }
    .bigo-ds-table tr:hover td { background:#fafafa; }
    .bigo-space-item { background:#fff; border:var(--border); border-radius:var(--radius); padding:12px 16px; margin-bottom:8px; }
    .bigo-space-row { display:flex; align-items:baseline; gap:10px; }
    .bigo-space-notation { font-family:'Fira Code',monospace; font-size:13px; font-weight:700; min-width:90px; }
    .bigo-space-text { font-size:13px; color:#4b5563; line-height:1.55; }
    /* ── FOCUS TAB ───────────────────────────────── */
    .focus-section { margin-bottom: 36px; }
    .focus-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; }
    .technique-card { background: #fff; border: var(--border); border-radius: var(--radius); padding: 20px; }
    .technique-header { display: flex; align-items: flex-start; gap: 12px; margin-bottom: 10px; }
    .technique-num { font-family: 'Fira Code', monospace; font-size: 18px; font-weight: 700; color: var(--blue); min-width: 28px; line-height: 1.2; }
    .technique-title { font-size: 15px; font-weight: 700; color: #111827; margin-bottom: 3px; }
    .technique-tag { font-size: 10.5px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
    .technique-body { font-size: 13.5px; color: #4b5563; line-height: 1.7; }
    .technique-tip { margin-top: 10px; background: #f9fafb; border-left: 3px solid var(--blue); border-radius: 0 4px 4px 0; padding: 8px 12px; font-size: 12.5px; color: #374151; line-height: 1.55; }
    .technique-tip strong { color: #111827; }
    .checklist { display: flex; flex-direction: column; gap: 8px; }
    .check-item { display: flex; gap: 10px; padding: 10px 14px; background: #fff; border: var(--border); border-radius: 6px; font-size: 13.5px; }
    .check-marker { font-family: 'Fira Code', monospace; font-size: 11px; color: var(--blue); font-weight: 700; white-space: nowrap; min-width: 48px; padding-top: 1px; }
    .check-text { color: #374151; line-height: 1.5; flex: 1; }
    .check-text strong { color: #111827; }
    .spaced-row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 10px; }
    .spaced-pill { background: var(--pat-bg); color: var(--pat-text); font-size: 11.5px; font-weight: 600; padding: 4px 10px; border-radius: 100px; }
    .week-phase-bar { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 18px; }
    .phase-btn { padding: 5px 12px; border: var(--border); border-radius: 5px; background: #fff; cursor: pointer; font-size: 12px; font-weight: 600; color: #374151; font-family: inherit; }
    .phase-btn:hover { background: #f5f5f5; }
    .phase-btn.active-phase { background: var(--blue); color: #fff; border-color: var(--blue); }
    .week-label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 20px 0 10px; padding-bottom: 6px; border-bottom: var(--border); }
    /* ── SETTINGS TAB ────────────────────────────── */
    .settings-section { margin-bottom: 32px; }
    .settings-section-title { font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin-bottom: 14px; }
    .plan-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; }
    .plan-card {
      background: #fff; border: 2px solid #e5e5e5; border-radius: var(--radius);
      padding: 20px; cursor: pointer; transition: border-color .15s, background .15s;
      text-align: left;
    }
    .plan-card:hover { border-color: #93c5fd; background: #f8fbff; }
    .plan-card.active { border-color: var(--blue); background: #EFF6FF; }
    .plan-card-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
    .plan-card-days { font-family: 'Fira Code', monospace; font-size: 28px; font-weight: 700; color: #111827; line-height: 1; }
    .plan-card.active .plan-card-days { color: var(--blue); }
    .plan-card-check { font-size: 18px; color: var(--blue); opacity: 0; }
    .plan-card.active .plan-card-check { opacity: 1; }
    .plan-card-title { font-size: 14px; font-weight: 600; color: #111827; margin-bottom: 6px; }
    .plan-card-desc { font-size: 12.5px; color: var(--muted); line-height: 1.55; margin-bottom: 10px; }
    .plan-card-meta { display: flex; gap: 8px; flex-wrap: wrap; }
    .plan-meta-pill { font-size: 11px; background: #f3f4f6; color: #374151; padding: 2px 8px; border-radius: 100px; }
    .plan-card.active .plan-meta-pill { background: #DBEAFE; color: #1D4ED8; }
    .settings-field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 16px; }
    .settings-label { font-size: 13px; font-weight: 600; color: #374151; }
    .settings-input { padding: 9px 12px; border: var(--border); border-radius: 6px; font-size: 14px; font-family: inherit; width: 100%; max-width: 320px; }
    .settings-input:focus { outline: none; border-color: var(--blue); }
    .settings-save-btn { padding: 9px 20px; background: var(--blue); color: #fff; border: none; border-radius: 6px; cursor: pointer; font-size: 13.5px; font-weight: 600; font-family: inherit; }
    .settings-save-btn:hover { background: #1d4ed8; }
    .settings-hint { font-size: 12px; color: var(--muted); margin-top: 3px; }
    .tab-nav::-webkit-scrollbar { display: none; }
    .tab-btn {
      padding: 12px 16px; border: none; background: transparent; cursor: pointer;
      font-size: 13px; font-weight: 500; color: var(--muted); white-space: nowrap;
      border-bottom: 2px solid transparent; transition: color .15s, border-color .15s;
      font-family: inherit;
    }
    .tab-btn.active { color: var(--blue); border-bottom-color: var(--blue); }
    .tab-btn:hover:not(.active) { color: #374151; }

    /* ── LAYOUT ──────────────────────────────────── */
    .container { max-width: 1160px; margin: 0 auto; padding: 24px 16px 48px; }
    .section-title { font-size: 20px; font-weight: 700; margin-bottom: 20px; }

    /* ── GENERIC CARD ────────────────────────────── */
    .card { background: #fff; border: var(--border); border-radius: var(--radius); padding: 20px; }

    /* ── GRID HELPERS ────────────────────────────── */
    .grid-3 { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
    .grid-2 { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 16px; }

    /* ── DAY PLAN ────────────────────────────────── */
    .day-card { background: #fff; border: var(--border); border-radius: var(--radius); padding: 18px; transition: border-color .18s, background .18s; }
    /* per-day color tokens */
    .day-card[data-day="1"] { --dc:#EF4444; --db:#FEF2F2; }
    .day-card[data-day="2"] { --dc:#F97316; --db:#FFF7ED; }
    .day-card[data-day="3"] { --dc:#D97706; --db:#FFFBEB; }
    .day-card[data-day="4"] { --dc:#10B981; --db:#ECFDF5; }
    .day-card[data-day="5"] { --dc:#06B6D4; --db:#ECFEFF; }
    .day-card[data-day="6"] { --dc:#8B5CF6; --db:#EEF2FF; }
    .day-card[data-day="7"] { --dc:#A855F7; --db:#FAF5FF; }
    .day-card[data-day="8"] { --dc:#EC4899; --db:#FDF2F8; }
    .day-card[data-day="9"] { --dc:#F43F5E; --db:#FFF1F2; }
    /* today */
    .day-card.today { border: 2px solid var(--blue); background: #EFF6FF; }
    .day-card.today .day-title { color: var(--blue); }
    .day-card.today .day-num { color: var(--blue); }
    /* hover — vivid per-day color, overrides today */
    .day-card.clickable:hover { border: 2px solid var(--dc) !important; background: var(--db) !important; }
    .day-card.clickable:hover .day-title { color: var(--dc); }
    .day-card.clickable:hover .day-num { color: var(--dc); opacity: .75; }
    .day-card.clickable:hover .topic-pill { background: var(--db); border: 1px solid var(--dc); color: var(--dc); }
    .day-card.clickable:hover .sched-period { color: var(--dc); }
    .day-card.clickable:hover .view-probs-hint { color: var(--dc); opacity: 1; }
    /* today pulse dot */
    @keyframes todayPulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.4;transform:scale(.75)} }
    .today-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--blue); display: inline-block; animation: todayPulse 1.8s ease-in-out infinite; flex-shrink: 0; }
    /* day indicator banner */
    .day-banner {
      display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
      background: #EFF6FF; border: 1px solid #BFDBFE; border-radius: var(--radius);
      padding: 12px 16px; margin-bottom: 20px;
    }
    .day-banner-label { font-size: 12px; font-weight: 700; color: var(--blue); }
    .day-banner-title { font-size: 13px; font-weight: 600; color: #1E40AF; }
    .day-banner-date { font-size: 12px; color: #3B82F6; }
    .day-banner-link { margin-left: auto; padding: 5px 12px; border: 1px solid #BFDBFE; border-radius: 5px; background: #fff; cursor: pointer; font-size: 12px; font-weight: 600; color: var(--blue); font-family: inherit; }
    .day-banner-link:hover { background: var(--blue); color: #fff; }
    .day-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
    .day-num { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); transition: color .18s; }
    .day-date { font-size: 12px; color: var(--muted); }
    .today-badge { display: flex; align-items: center; gap: 5px; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; background: var(--blue); color: #fff; padding: 3px 7px; border-radius: 3px; }
    .day-title { font-size: 15px; font-weight: 600; margin: 8px 0 10px; transition: color .18s; }
    .topic-pills { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 14px; }
    .topic-pill { background: var(--pat-bg); color: var(--pat-text); font-size: 11px; font-weight: 500; padding: 2px 8px; border-radius: 100px; transition: background .18s, color .18s, border-color .18s; }
    .schedule-list { display: flex; flex-direction: column; gap: 7px; }
    .sched-item { display: flex; gap: 8px; font-size: 12.5px; align-items: flex-start; }
    .sched-period { font-weight: 600; color: #374151; min-width: 72px; flex-shrink: 0; transition: color .18s; }
    .sched-task { color: #4b5563; flex: 1; line-height: 1.4; }
    .sched-dur { color: var(--muted); font-size: 11.5px; white-space: nowrap; }
    .callout { background: #EFF6FF; border: 1px solid #BFDBFE; border-radius: var(--radius); padding: 16px 20px; margin-top: 24px; font-size: 13.5px; line-height: 1.65; color: #1E40AF; }

    /* ── BADGES ──────────────────────────────────── */
    .badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 600; }
    .badge-easy { background: var(--easy-bg); color: var(--easy-text); }
    .badge-medium { background: var(--med-bg); color: var(--med-text); }
    .badge-hard { background: var(--hard-bg); color: var(--hard-text); }
    .badge-pat { background: var(--pat-bg); color: var(--pat-text); }

    /* ── ANNOTATED CODE ──────────────────────────── */
    .code-pairs { display: flex; flex-direction: column; gap: 0; }
    .code-pair { margin-bottom: 5px; }
    .code-line-text {
      display: block; font-family: 'Fira Code', monospace; font-size: 12px;
      background: var(--code-bg); padding: 4px 10px; border-radius: 3px;
      white-space: pre; overflow-x: auto;
    }
    .code-note { font-size: 12px; color: var(--muted); padding: 2px 10px 3px; line-height: 1.45; }

    /* ── PATTERNS ────────────────────────────────── */
    .pattern-card { background: #fff; border: var(--border); border-radius: var(--radius); padding: 20px; margin-bottom: 14px; }
    .pattern-head { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
    .pattern-name { font-size: 16px; font-weight: 600; }
    .pattern-pill { font-size: 11px; font-weight: 600; padding: 3px 10px; border-radius: 100px; }
    .pattern-trigger { font-size: 13px; color: var(--muted); font-style: italic; margin-bottom: 14px; }
    .pattern-trigger strong { font-style: normal; color: #374151; }

    /* ── FILTER BAR ──────────────────────────────── */
    .filter-bar { display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 20px; }
    .filter-btn {
      padding: 6px 14px; border: var(--border); border-radius: 100px;
      background: #fff; cursor: pointer; font-size: 12.5px; font-weight: 500;
      color: #374151; transition: background .15s, color .15s, border-color .15s;
      font-family: inherit;
    }
    .filter-btn.active { background: var(--blue); color: #fff; border-color: var(--blue); }
    .filter-btn:hover:not(.active) { border-color: #9ca3af; }

    /* ── FLASHCARDS ──────────────────────────────── */
    .flashcard-area { max-width: 580px; margin: 0 auto; }
    .flashcard-wrapper { perspective: 800px; height: 310px; cursor: pointer; user-select: none; margin-bottom: 18px; }
    .flashcard-inner { position: relative; width: 100%; height: 100%; transform-style: preserve-3d; transition: transform .5s ease; }
    .flashcard-inner.flipped { transform: rotateY(180deg); }
    .fc-face {
      position: absolute; width: 100%; height: 100%;
      backface-visibility: hidden; -webkit-backface-visibility: hidden;
      background: #fff; border: var(--border); border-radius: var(--radius);
      padding: 28px 24px; display: flex; flex-direction: column; justify-content: space-between;
    }
    .fc-back-face { transform: rotateY(180deg); background: #FAFBFF; }
    .fc-label-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .fc-q { font-size: 16px; font-weight: 600; line-height: 1.5; flex: 1; display: flex; align-items: center; }
    .fc-a { font-size: 13.5px; line-height: 1.7; flex: 1; display: flex; align-items: flex-start; color: #1E40AF; padding-top: 4px; }
    .fc-hint { font-size: 11px; color: var(--muted); text-align: center; }
    .fc-nav { display: flex; align-items: center; justify-content: center; gap: 14px; margin-top: 8px; }
    .nav-btn { padding: 8px 20px; border: var(--border); border-radius: 6px; background: #fff; cursor: pointer; font-size: 13.5px; font-weight: 500; font-family: inherit; }
    .nav-btn:hover:not(:disabled) { background: #f5f5f5; }
    .nav-btn:disabled { opacity: .35; cursor: default; }
    .card-counter { font-family: 'Fira Code', monospace; font-size: 13px; color: var(--muted); }

    /* ── PROBLEMS ────────────────────────────────── */
    .problem-card { background: #fff; border: var(--border); border-radius: var(--radius); padding: 20px; margin-bottom: 14px; transition: border-color .2s, background .2s; }
    .problem-card.is-done { border-left: 3px solid #059669; background: #F0FDF4; }
    .prob-head { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 10px; }

    .prob-desc { font-size: 13.5px; color: #4b5563; margin-bottom: 16px; line-height: 1.6; }

    .complexity-row { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }

    /* ── MOCK TIMER ──────────────────────────────── */

    .mock-tabs { display: flex; border-bottom: var(--border); margin-bottom: 0; }
    .mock-tab-btn { padding: 10px 18px; border: none; background: transparent; cursor: pointer; font-size: 13px; font-weight: 600; color: var(--muted); border-bottom: 2px solid transparent; font-family: inherit; }
    .mock-tab-btn.active { color: var(--blue); border-bottom-color: var(--blue); }
    .mock-tab-btn:hover:not(.active) { color: #374151; }
    .code-editor-wrap { display: flex; flex-direction: column; gap: 10px; padding: 16px 20px 20px; background: #fff; border: var(--border); border-top: none; border-radius: 0 0 var(--radius) var(--radius); margin-bottom: 20px; }
    .code-editor { font-family: 'Fira Code', monospace; font-size: 13px; line-height: 1.65; padding: 14px 16px; border: 1px solid #3c3c3c; border-radius: 6px; background: #1e1e1e; color: #d4d4d4; resize: vertical; min-height: 220px; width: 100%; tab-size: 4; white-space: pre; overflow-x: auto; }
    .code-editor:focus { outline: none; border-color: var(--blue); }
    .code-run-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .code-run-btn { padding: 8px 20px; background: #22c55e; color: #fff; border: none; border-radius: 6px; cursor: pointer; font-size: 13.5px; font-weight: 700; font-family: inherit; transition: background .15s; }
    .code-run-btn:hover:not(:disabled) { background: #16a34a; }

    .code-reset-btn { padding: 8px 14px; border: var(--border); border-radius: 6px; background: #fff; cursor: pointer; font-size: 12.5px; font-weight: 600; font-family: inherit; }
    .code-reset-btn:hover { background: #f5f5f5; }
    .code-pyodide-note { font-size: 11.5px; color: var(--muted); font-style: italic; }
    .code-output { font-family: 'Fira Code', monospace; font-size: 12.5px; padding: 12px 14px; border-radius: 6px; background: #f4f4f5; border: var(--border); min-height: 48px; white-space: pre-wrap; line-height: 1.6; color: #374151; }
    .code-output.error { background: #FEF2F2; border-color: #FECACA; color: #DC2626; }
    .code-tests { display: flex; flex-direction: column; gap: 6px; }
    .code-tests-header { font-size: 12px; font-weight: 700; color: #374151; margin-bottom: 4px; text-transform: uppercase; letter-spacing: .07em; }
    .code-test-row { display: flex; align-items: flex-start; gap: 8px; padding: 6px 10px; border-radius: 5px; font-size: 12px; font-family: 'Fira Code', monospace; }
    .code-test-row.pass { background: #F0FDF4; border: 1px solid #BBF7D0; }
    .code-test-row.fail { background: #FEF2F2; border: 1px solid #FECACA; }
    .code-test-icon { font-size: 13px; font-weight: 700; flex-shrink: 0; }
    .code-test-row.pass .code-test-icon { color: #059669; }
    .code-test-row.fail .code-test-icon { color: #DC2626; }
    .code-test-call { color: #374151; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
    .code-test-result { color: var(--muted); flex-shrink: 0; }
    .mock-problem-panel { background: #fff; border: var(--border); border-radius: var(--radius); padding: 20px; margin-bottom: 20px; }
    .mock-problem-title { font-size: 18px; font-weight: 700; color: #111827; margin-bottom: 8px; }
    .mock-problem-desc { font-size: 14px; color: #374151; line-height: 1.7; margin-bottom: 16px; }
    .mock-section-label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin-bottom: 8px; margin-top: 16px; }
    .mock-examples { display: flex; flex-direction: column; gap: 10px; }
    .mock-example { background: var(--code-bg); border-radius: 5px; padding: 10px 14px; font-family: 'Fira Code', monospace; font-size: 12px; line-height: 1.7; }
    .mock-example-io { color: #374151; }
    .mock-example-label { color: var(--muted); font-size: 11px; margin-right: 4px; }
    .mock-example-explanation { font-size: 12px; color: var(--muted); font-style: italic; margin-top: 4px; font-family: 'Inter', sans-serif; }
    .mock-constraints { display: flex; flex-direction: column; gap: 4px; }
    .mock-constraint { font-size: 12.5px; color: #374151; padding: 3px 0; font-family: 'Fira Code', monospace; }
    .mock-no-problem { background: #f9fafb; border: var(--border); border-radius: var(--radius); padding: 28px 20px; text-align: center; color: var(--muted); font-size: 13.5px; margin-bottom: 20px; }
    .mock-card {
      background: #fff; border: var(--border); border-radius: var(--radius);
      padding: 14px 16px; cursor: pointer; transition: border-color .15s;
    }
    .mock-card.selected { border-color: var(--blue); background: #EFF6FF; }

    .mock-title { font-size: 13.5px; font-weight: 600; margin-bottom: 5px; }
    .mock-pat { font-size: 11.5px; color: var(--muted); }
    .timer-wrap { text-align: center; margin-bottom: 24px; }
    .timer-disp { font-family: 'Fira Code', monospace; font-size: clamp(52px,10vw,80px); font-weight: 600; letter-spacing: .05em; color: #111827; line-height: 1; }
    .timer-disp.warn { color: #D97706; }
    .timer-disp.danger { color: #DC2626; }
    .timer-alert { margin-top: 10px; font-size: 14px; font-weight: 600; color: #D97706; min-height: 22px; }
    .timer-alert.danger { color: #DC2626; }
    .timer-ctrls { display: flex; gap: 10px; justify-content: center; margin-bottom: 30px; }
    .t-btn { padding: 10px 24px; border-radius: 6px; border: var(--border); cursor: pointer; font-size: 14px; font-weight: 600; background: #fff; color: #374151; font-family: inherit; }
    .t-btn.primary { background: var(--blue); color: #fff; border-color: var(--blue); }
    .t-btn:hover:not(.primary) { background: #f5f5f5; }
    .protocol-card { background: #fff; border: var(--border); border-radius: var(--radius); padding: 20px; }
    .protocol-title { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin-bottom: 14px; }
    .p-item { display: flex; gap: 12px; margin-bottom: 10px; font-size: 13px; align-items: flex-start; }
    .p-time { font-family: 'Fira Code', monospace; font-size: 11px; background: var(--pat-bg); color: var(--pat-text); padding: 3px 8px; border-radius: 4px; white-space: nowrap; flex-shrink: 0; }
    .p-desc { color: #4b5563; line-height: 1.5; }

    /* ── TIPS ────────────────────────────────────── */
    .tips-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 16px; }
    .tip-card { background: #fff; border: var(--border); border-radius: var(--radius); padding: 20px; }
    .tip-title { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin-bottom: 14px; }
    .tip-list { list-style: none; display: flex; flex-direction: column; gap: 9px; }
    .tip-list li { font-size: 13.5px; color: #374151; line-height: 1.5; padding-left: 16px; position: relative; }
    .tip-list li::before { content: '—'; position: absolute; left: 0; color: var(--muted); }

    /* ── HOME PAGE ───────────────────────────────── */
    .home-hero { text-align: center; padding: 32px 0 24px; }
    .home-title { font-size: clamp(22px,5vw,34px); font-weight: 700; margin-bottom: 8px; }
    .home-sub { font-size: 14px; color: var(--muted); margin-bottom: 28px; }
    .home-actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-bottom: 32px; }
    .home-btn { padding: 11px 20px; border-radius: 8px; border: var(--border); background: #fff; cursor: pointer; font-size: 13.5px; font-weight: 600; color: #374151; transition: border-color .15s, color .15s; font-family: inherit; }
    .home-btn:hover { border-color: var(--blue); color: var(--blue); }
    .home-btn.primary { background: var(--blue); color: #fff; border-color: var(--blue); }
    .home-btn.primary:hover { background: #1d4ed8; color: #fff; }
    .home-stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; margin-bottom: 24px; }
    .home-stat { background: #fff; border: var(--border); border-radius: var(--radius); padding: 16px 18px; }
    .home-stat-val { font-family: 'Fira Code', monospace; font-size: 26px; font-weight: 600; color: #111827; line-height: 1; }
    .home-stat-label { font-size: 11.5px; color: var(--muted); margin-top: 5px; }
    .home-today { background: #fff; border: var(--border); border-left: 3px solid var(--blue); border-radius: var(--radius); padding: 18px 20px; margin-bottom: 24px; }
    .home-today-hd { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
    .home-today-title { font-size: 15px; font-weight: 600; }
    .home-today-sched { display: flex; flex-direction: column; gap: 6px; }
    /* quote */
    .quote-card { background: #fff; border: var(--border); border-radius: var(--radius); padding: 22px 24px; margin-bottom: 24px; }
    .quote-text { font-size: 15px; line-height: 1.65; color: #374151; font-style: italic; }
    .quote-attr { font-size: 11px; color: var(--muted); margin-top: 8px; }
    .quote-dots { display: flex; gap: 6px; justify-content: center; margin-top: 14px; }
    .q-dot { width: 6px; height: 6px; border-radius: 50%; background: #e5e7eb; cursor: pointer; transition: background .15s; border: none; padding: 0; }
    .q-dot.active { background: var(--blue); }

    /* ── DAY CARD CLICKABLE ──────────────────────── */
    .day-card.clickable { cursor: pointer; }
    .view-probs-hint { font-size: 11px; color: var(--blue); margin-top: 10px; font-weight: 500; opacity: 0; transition: opacity .18s; }

    /* ── POMODORO WIDGET ─────────────────────────── */

    /* ── LEETCODE PROBLEMS ───────────────────────── */
    .lc-section { margin-top: 14px; }
    .lc-section-label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin-bottom: 8px; }
    .lc-grid { display: flex; flex-wrap: wrap; gap: 6px; }
    .lc-link {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 5px 10px; border: var(--border); border-radius: 5px;
      background: #fff; cursor: pointer; font-size: 12px;
      color: #374151; font-family: inherit; text-decoration: none;
      transition: border-color .12s, background .12s, color .12s;
    }
    .lc-link:hover { border-color: #FB923C; background: #FFF7ED; color: #9A3412; }
    .lc-num { font-family: 'Fira Code', monospace; font-size: 10.5px; color: var(--muted); }

    /* ── AI FAB BUTTONS ──────────────────────────── */
    .ai-fabs {
      position: fixed; bottom: 20px; right: 20px; z-index: 600;
      display: flex; flex-direction: column; gap: 8px; align-items: flex-end;
    }
    .ai-fab {
      display: flex; align-items: center; gap: 7px;
      border: none; border-radius: 100px;
      padding: 10px 18px; cursor: pointer;
      font-size: 13px; font-weight: 600; font-family: inherit;
      white-space: nowrap;
      transition: filter .15s, transform .1s;
    }
    .ai-fab:hover { filter: brightness(1.12); transform: translateY(-1px); }
    .ai-fab-gemini { background: #1a73e8; color: #fff; box-shadow: 0 2px 14px rgba(26,115,232,.35); }
    .ai-fab-claude { background: #E8611A; color: #fff; box-shadow: 0 2px 14px rgba(232,97,26,.35); }
    .ai-fab-chatgpt { background: #10a37f; color: #fff; box-shadow: 0 2px 14px rgba(16,163,127,.35); }
    .ai-fab.copied  { background: #059669 !important; }
    .ai-fab-icon { font-size: 13px; }
    .ask-claude-inline {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 7px 14px; border-radius: 6px;
      border: 1px solid #e5e5e5; background: #fff;
      cursor: pointer; font-size: 12px; font-weight: 600;
      color: #374151; font-family: inherit;
      transition: background .1s, border-color .1s, color .1s;
    }
    .ask-claude-inline:hover { background: #E8611A; color: #fff; border-color: #E8611A; }
    .ask-claude-inline.copied { background: #ECFDF5; color: #059669; border-color: #A7F3D0; }

    /* ── DATA STRUCTURES / ALGORITHMS TABS ─────────── */
    .ds-card { background: #fff; border: var(--border); border-radius: var(--radius); margin-bottom: 10px; overflow: hidden; }
    .ds-header { display: flex; align-items: flex-start; gap: 12px; padding: 16px 18px; cursor: pointer; user-select: none; }
    .ds-header:hover { background: #fafafa; }
    .ds-header-left { flex: 1; min-width: 0; }
    .ds-name-row { display: flex; align-items: center; gap: 8px; margin-bottom: 3px; flex-wrap: wrap; }
    .ds-name { font-size: 15px; font-weight: 700; color: #111827; }
    .ds-summary { font-size: 12.5px; color: var(--muted); }
    .ds-toggle { font-size: 11px; color: var(--muted); flex-shrink: 0; padding-top: 2px; }
    .ds-body { padding: 0 18px 18px; border-top: var(--border); }
    .cx-table-wrap { overflow-x: auto; border: var(--border); border-radius: 5px; margin: 14px 0; }
    .cx-table { width: 100%; border-collapse: collapse; background: #fff; font-size: 12.5px; }
    .cx-table th { padding: 7px 12px; text-align: left; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); background: #f9fafb; border-bottom: var(--border); white-space: nowrap; }
    .cx-table td { padding: 8px 12px; border-bottom: var(--border); vertical-align: top; }
    .cx-table tr:last-child td { border-bottom: none; }
    .cx-table td:first-child { font-weight: 600; color: #374151; }

    .cx-table td:nth-child(3) { color: #4b5563; font-size: 12px; }
    .insight-box { background: #EFF6FF; border: 1px solid #BFDBFE; border-radius: 5px; padding: 10px 14px; margin: 12px 0; font-size: 13px; color: #1E40AF; line-height: 1.6; }
    .ds-section-label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 14px 0 6px; }
    .pill-list { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 2px; }
    .pill-list-item { background: #f3f4f6; color: #374151; font-size: 11.5px; padding: 3px 9px; border-radius: 100px; }
    .pitfall-list { display: flex; flex-direction: column; gap: 5px; }
    .pitfall-item { font-size: 12.5px; color: #92400E; background: #FFFBEB; border: 1px solid #FDE68A; border-radius: 4px; padding: 6px 10px; line-height: 1.5; }
    .approach-block { background: #f9fafb; border: var(--border); border-radius: 5px; padding: 12px 14px; margin-bottom: 10px; }
    .approach-header { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
    .approach-name { font-size: 13px; font-weight: 700; color: #111827; }
    .approach-cx { font-family: 'Fira Code', monospace; font-size: 11px; background: #fff; border: var(--border); padding: 2px 7px; border-radius: 3px; color: #374151; }
    .approach-verdict { font-size: 11px; color: var(--muted); font-style: italic; }
    .jump-bar { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 20px; }
    .jump-btn { padding: 5px 12px; border: var(--border); border-radius: 100px; background: #fff; cursor: pointer; font-size: 12px; font-weight: 500; color: #374151; font-family: inherit; }
    .jump-btn:hover { background: #f5f5f5; }
    .jump-btn.active-section { background: #111827; color: #fff; border-color: #111827; }

    /* ── RITUAL ──────────────────────────────────── */
    .ritual-step { display: flex; align-items: flex-start; gap: 16px; background: #fff; border: var(--border); border-radius: var(--radius); padding: 16px 18px; }
    .ritual-num { font-family: 'Fira Code', monospace; font-size: 24px; font-weight: 700; color: var(--blue); min-width: 30px; line-height: 1.1; flex-shrink: 0; }
    .ritual-name { font-size: 15px; font-weight: 700; color: #111827; margin-bottom: 4px; }
    .ritual-desc { font-size: 13.5px; color: #4b5563; line-height: 1.6; }
    .pattern-table-wrap { border: var(--border); border-radius: var(--radius); overflow: hidden; margin-bottom: 8px; }
    .pat-algo-table { width: 100%; border-collapse: collapse; background: #fff; }
    .pat-algo-table th { padding: 9px 16px; text-align: left; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); background: #f9fafb; border-bottom: var(--border); }
    .pat-algo-table td { padding: 9px 16px; font-size: 13px; border-bottom: var(--border); vertical-align: middle; }
    .pat-algo-table tr:last-child td { border-bottom: none; }
    .pat-algo-table tr:hover td { background: #fafafa; }
    .pat-algo-table td:first-child { color: #4b5563; font-style: italic; }
    .ref-section-title { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin-bottom: 12px; }
    .template-card { background: #fff; border: var(--border); border-radius: var(--radius); padding: 18px; }
    .template-name { font-size: 15px; font-weight: 700; color: #111827; margin-bottom: 3px; }
    .template-sub { font-size: 12px; color: var(--muted); margin-bottom: 12px; }
    .template-when { font-size: 12.5px; color: #4b5563; margin-bottom: 10px; }
    .template-when strong { color: #374151; }
    .template-code { font-family: 'Fira Code', monospace; font-size: 12px; background: var(--code-bg); padding: 12px 14px; border-radius: 5px; overflow-x: auto; line-height: 1.65; color: #374151; white-space: pre; display: block; margin: 0; }
    .gotcha-item { background: #FFFBEB; border: 1px solid #FDE68A; border-radius: 6px; padding: 12px 16px; font-size: 13px; color: #78350F; line-height: 1.6; }
    code.ic { font-family: 'Fira Code', monospace; font-size: 11.5px; background: #f3f4f6; padding: 1px 5px; border-radius: 3px; color: #374151; }

    /* ── SIDE TIMER ──────────────────────────────── */
    .side-timer {
      position: fixed; right: 0; top: 50%; transform: translateY(-50%);
      z-index: 400; background: #fff;
      border: var(--border); border-right: none;
      border-radius: 10px 0 0 10px;
      width: 58px;
      display: flex; flex-direction: column; align-items: center;
      padding: 10px 0;
      box-shadow: -2px 0 14px rgba(0,0,0,.07);
      font-family: inherit; user-select: none;
      transition: width .2s ease;
      cursor: pointer;
    }
    .side-timer.expanded { width: 178px; cursor: default; padding: 14px 14px 12px; align-items: stretch; }
    .st-collapsed-time { font-family: 'Fira Code', monospace; font-size: 14px; font-weight: 700; color: #111827; line-height: 1; text-align: center; letter-spacing: .02em; }
    .st-collapsed-time.running { color: var(--blue); }
    .st-collapsed-time.done { color: #DC2626; }
    .st-collapsed-hint { font-size: 8.5px; color: var(--muted); margin-top: 4px; text-align: center; font-weight: 600; text-transform: uppercase; letter-spacing: .07em; }
    .st-exp-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
    .st-exp-title { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
    .st-close { background: none; border: none; cursor: pointer; font-size: 14px; color: var(--muted); padding: 0; line-height: 1; }
    .st-close:hover { color: #111827; }
    .st-big-time { font-family: 'Fira Code', monospace; font-size: 28px; font-weight: 700; text-align: center; line-height: 1; margin-bottom: 4px; color: #111827; }
    .st-big-time.running { color: var(--blue); }

  {q:'How does binary search work?',a:'Repeatedly halve the search space. mid = lo + (hi - lo) // 2. If equal: found. If target > mid: search right half. If target < mid: search left half. O(log n).',tag:'arrays',label:'Binary Search'},
  {q:'What is the lower bound in binary search?',a:'First position where arr[i] >= target. Use lo < hi (not <=), and when arr[mid] >= target set hi = mid (keep mid as candidate). Return lo.',tag:'arrays',label:'Binary Search'},
  {q:'What is binary search on the answer space?',a:'When you can\'t search an array but can define a condition(k) that is monotone (False...False...True...True), binary search for the smallest k where condition(k) is True.',tag:'arrays',label:'Binary Search'},
  {q:'What is a prefix sum array?',a:'prefix[i] = sum of arr[0..i-1]. Build in O(n). Range sum query arr[i..j] = prefix[j+1] - prefix[i] in O(1). Essential for range query problems.',tag:'arrays',label:'Arrays'},
  {q:'What is Kadane\'s algorithm?',a:'Max subarray sum in O(n). At each step: curr = max(n, curr + n). Restart (take just n) if curr is negative. Track global max. Handles all-negative arrays by initializing both to arr[0].',tag:'arrays',label:'Arrays'},
  {q:'What is the top-K frequent elements pattern?',a:'Count with hash map O(n). Then use a min-heap of size k: O(n log k). Or bucket sort by frequency: index = frequency, O(n). The heap approach generalizes to streaming data.',tag:'arrays',label:'Hashing'},
  {q:'How do you find the k-th largest element?',a:'Sort: O(n log n). Min-heap of size k: O(n log k) — best for streams or large n/small k. Quickselect: O(n) average, O(n²) worst, O(1) space. BST inorder: O(h+k) if tree given.',tag:'arrays',label:'Arrays'},
  {q:'What is a monotonic stack?',a:'Stack maintaining sorted order (increasing or decreasing). Pop elements that violate the order when a new element arrives. Used for: next greater/smaller element, largest rectangle, trapping rain water, sum of subarray minimums.',tag:'misc',label:'Stack'},
  {q:'What is a monotonic deque?',a:'A deque that maintains sorted order — elements are removed from the back when a new element makes them useless. Used for sliding window maximum/minimum in O(n). The front is always the current window\'s extremum.',tag:'misc',label:'Stack'},
  {q:'How do you detect a duplicate in an array?',a:'Hash set: O(n) time, O(n) space. Sort then scan: O(n log n), O(1) space. XOR trick (for single missing/duplicate): O(n), O(1). Cyclic sort (values in [1..n]): O(n), O(1).',tag:'arrays',label:'Arrays'},

  // ── Trees ─────────────────────────────────────
  {q:'What are the three tree traversal orders?',a:'Inorder (L→root→R): visits BST in sorted order. Preorder (root→L→R): serialize/copy a tree. Postorder (L→R→root): delete a tree or compute subtree info bottom-up.',tag:'trees',label:'Trees'},
  {q:'BFS vs DFS — when do you use each?',a:'BFS: shortest path (unweighted), level-by-level, nearest node. DFS: detect cycles, topological sort, all paths, backtracking, deep solutions. BFS uses more memory (wide trees); DFS uses more stack (tall trees).',tag:'trees',label:'Trees'},
  {q:'What is a binary search tree?',a:'Left subtree values < node, right subtree values > node. Search/insert/delete O(h). Balanced BST (AVL, Red-Black) gives O(log n). Skewed BST degrades to O(n). Python has no built-in BST — use sortedcontainers.SortedList.',tag:'trees',label:'Trees'},
  {q:'Space complexity of DFS vs BFS on a tree?',a:'DFS: O(h) — call stack depth equals tree height. O(log n) balanced, O(n) skewed. BFS: O(w) — queue holds the widest level. O(n) worst case (complete tree). Both are O(n) worst case.',tag:'trees',label:'Trees'},
  {q:'How do you find the lowest common ancestor (LCA)?',a:'Recursive: if root is null or equals p or q, return root. Recurse left and right. If both sides return non-null, root is LCA. Otherwise return the non-null side. O(n) time, O(h) space.',tag:'trees',label:'Trees'},
  {q:'How do you check if a binary tree is a valid BST?',a:'Pass min/max bounds down recursively. node.val must be in (min_val, max_val). For left subtree: max_val = node.val. For right: min_val = node.val. Initialize bounds as (-inf, +inf).',tag:'trees',label:'Trees'},
  {q:'What is a heap and what are its operations?',a:'Complete binary tree satisfying the heap property (min-heap: parent ≤ children). Insert: O(log n) sift-up. Extract-min: O(log n) sift-down. Peek: O(1). Heapify (build from list): O(n) — not O(n log n).',tag:'trees',label:'Heap'},
  {q:'How do you implement a max-heap in Python?',a:'Python\'s heapq is a min-heap only. Simulate max-heap by negating values: push -x, pop and negate the result. For objects, negate the priority key in a tuple: heappush(h, (-priority, item)).',tag:'trees',label:'Heap'},
  {q:'What is a segment tree?',a:'Binary tree for range queries and point updates. Build: O(n). Query (range sum/min/max): O(log n). Update (point): O(log n). Used when you need both range queries and updates — unlike prefix sums which only support static arrays.',tag:'trees',label:'Advanced'},
  {q:'What is a Fenwick tree (Binary Indexed Tree)?',a:'Array-based structure for prefix sum queries and point updates, both O(log n). More cache-friendly and simpler to code than segment tree. Limitation: harder to extend to arbitrary range queries. i & (-i) isolates the lowest set bit.',tag:'trees',label:'Advanced'},

  // ── Graphs ────────────────────────────────────
  {q:'What data structure does BFS use? DFS?',a:'BFS uses a queue (FIFO) — always use collections.deque, never list (list.popleft is O(n)). DFS uses a stack (LIFO) — explicit list or the call stack via recursion.',tag:'graphs',label:'Graphs'},
  {q:'What is topological sort?',a:'Linear ordering where for every directed edge u→v, u appears before v. Only valid on DAGs. Two implementations: Kahn\'s (BFS + in-degree count) and DFS postorder reversal. Kahn\'s naturally detects cycles (output length < total nodes).',tag:'graphs',label:'Graphs'},
  {q:'How does Kahn\'s algorithm work?',a:'(1) Count in-degree for each node. (2) Add all 0-in-degree nodes to a queue. (3) Dequeue a node, append to result, decrement neighbors\' in-degrees. (4) Enqueue any neighbor that reaches 0. If result length < n, a cycle exists.',tag:'graphs',label:'Graphs'},
  {q:'What is Dijkstra\'s algorithm?',a:'Shortest path from a source to all nodes in a weighted graph with non-negative edges. Uses a min-heap. O((V+E) log V). Cannot handle negative edge weights — use Bellman-Ford instead.',tag:'graphs',label:'Advanced'},
  {q:'What is Bellman-Ford and when do you need it?',a:'Shortest path algorithm that handles negative edge weights. Relaxes all edges V-1 times. O(VE). If any edge can still be relaxed after V-1 rounds, a negative cycle exists. Use when: negative weights, detecting negative cycles.',tag:'graphs',label:'Advanced'},
  {q:'What is Floyd-Warshall?',a:'All-pairs shortest path. O(V³) time, O(V²) space. dp[i][j] = shortest path from i to j. Update: dp[i][j] = min(dp[i][j], dp[i][k] + dp[k][j]) for each intermediate node k. Handles negative weights (not negative cycles).',tag:'graphs',label:'Advanced'},
  {q:'What is a Minimum Spanning Tree?',a:'A spanning tree of a weighted undirected graph with minimum total edge weight. Kruskal\'s: sort edges, add greedily using Union-Find (O(E log E)). Prim\'s: grow from a starting node using a min-heap (O(E log V)).',tag:'graphs',label:'Advanced'},
  {q:'What is Union-Find (Disjoint Set)?',a:'Tracks connected components. find(x) returns root with path compression. union(x,y) merges components by rank. Both operations are O(α(n)) ≈ O(1) amortized. Used for: connected components, cycle detection, Kruskal\'s MST.',tag:'graphs',label:'Advanced'},
  {q:'What is path compression in Union-Find?',a:'During find(x), point every node on the path directly to the root: self.parent[x] = self.find(self.parent[x]). Flattens the tree. Combined with union by rank, gives near-O(1) amortized per operation.',tag:'graphs',label:'Advanced'},
  {q:'How do you detect a cycle in a directed graph?',a:'DFS with three states: unvisited (0), in-progress (1), done (2). A cycle exists if you visit a node currently in-progress (state=1). Kahn\'s topological sort also detects cycles: if output length < n, cycle present.',tag:'graphs',label:'Graphs'},
  {q:'How do you detect a cycle in an undirected graph?',a:'DFS: a cycle exists if you visit an already-visited neighbor that isn\'t the node you came from (track parent). Union-Find: cycle exists if union(u,v) returns False (both already in the same component).',tag:'graphs',label:'Graphs'},
  {q:'What is a strongly connected component (SCC)?',a:'A maximal set of vertices in a directed graph where every vertex is reachable from every other. Tarjan\'s (DFS + discovery/low times) and Kosaraju\'s (two DFS passes) both run in O(V+E).',tag:'graphs',label:'Advanced'},
  {q:'What is a DAG and why is it special?',a:'Directed Acyclic Graph — no directed cycles. Enables: topological sort, DP on the structure (shortest/longest path), scheduling, dependency resolution. Many graph DP problems only work because the graph is a DAG.',tag:'graphs',label:'Graphs'},
  {q:'When is BFS guaranteed to find the shortest path?',a:'When all edge weights are equal (unweighted graphs or uniform weights). For weighted graphs, use Dijkstra (non-negative) or Bellman-Ford (negative allowed). For a 0-1 weighted graph, use 0-1 BFS with a deque.',tag:'graphs',label:'Graphs'},

  // ── Dynamic Programming ───────────────────────
  {q:'What is memoization?',a:'Top-down DP: cache function results to avoid recomputation. Converts O(2^n) naive recursion to O(n) or O(n²). Use a dict or @functools.lru_cache. Only compute what you need. Bottom-up tabulation is usually faster (no recursion overhead).',tag:'dp',label:'DP'},
  {q:'How do you recognize a DP problem?',a:'Two signals: (1) Optimal substructure — the global optimum is built from local optima. (2) Overlapping subproblems — the same sub-calculation recurs. Trigger phrases: "minimum/maximum", "how many ways", "can you reach", "longest/shortest".',tag:'dp',label:'DP'},
  {q:'What is the Fibonacci DP recurrence?',a:'dp[i] = dp[i-1] + dp[i-2]. Base cases: dp[0]=0, dp[1]=1. O(n) time. O(1) space if you only keep the last two values: a, b = b, a+b.',tag:'dp',label:'DP'},
  {q:'What is the 0/1 knapsack recurrence?',a:'dp[c] = max(dp[c], dp[c - weight] + value) for each item. CRITICAL: iterate capacity in reverse (range(W, weight-1, -1)) to prevent using the same item twice. Forward iteration = unbounded knapsack.',tag:'dp',label:'DP'},
  {q:'What is the coin change recurrence?',a:'dp[a] = min(dp[a], 1 + dp[a-coin]) for each coin and each amount a from 1 to target. Base case: dp[0]=0. Initialize all to infinity. This is unbounded knapsack — each coin can be used multiple times.',tag:'dp',label:'DP'},
  {q:'What is the LCS recurrence?',a:'If s[i-1]==t[j-1]: dp[i][j] = dp[i-1][j-1] + 1. Else: dp[i][j] = max(dp[i-1][j], dp[i][j-1]). Base case: all 0 (empty string). O(m×n) time and space. Can reduce space to O(min(m,n)) with rolling array.',tag:'dp',label:'DP'},
  {q:'What is the edit distance recurrence?',a:'If w1[i-1]==w2[j-1]: dp[i][j] = dp[i-1][j-1]. Else: dp[i][j] = 1 + min(dp[i-1][j], dp[i][j-1], dp[i-1][j-1]) for delete, insert, replace. Base: dp[i][0]=i, dp[0][j]=j.',tag:'dp',label:'DP'},
  {q:'What is interval DP?',a:'DP over sub-intervals of an array. State: dp[i][j] = answer for subarray [i..j]. Fill by increasing interval length. Example: burst balloons, matrix chain multiplication, minimum cost to merge stones. Usually O(n³).',tag:'dp',label:'DP'},
  {q:'What is bitmask DP?',a:'Uses a bitmask to represent subset state, compressing exponential state space. State: dp[mask][i] = answer with the set of visited nodes represented by mask, ending at i. Used for: TSP, shortest path visiting all nodes. O(2^n × n²).',tag:'dp',label:'DP'},
  {q:'What is tree DP?',a:'DP on tree structure, usually done postorder (compute children first, then parent). State: dp[node] = answer for the subtree rooted at node. Example: house robber III, binary tree cameras, maximum path sum.',tag:'dp',label:'DP'},
  {q:'What is the LIS (Longest Increasing Subsequence) complexity?',a:'O(n²) DP: dp[i] = max(dp[j]+1) for all j < i where arr[j] < arr[i]. O(n log n) patience sorting: maintain a "tails" array and binary search for each element. The length of tails is the LIS length.',tag:'dp',label:'DP'},
  {q:'What is memoization vs tabulation?',a:'Memoization (top-down): recursive + cache. Only computes needed states. Natural to write. Has recursion overhead. Tabulation (bottom-up): iterative + table. Computes all states. Faster in practice. Better for space optimization.',tag:'dp',label:'DP'},

  // ── Strings ───────────────────────────────────
  {q:'What is the KMP algorithm?',a:'Knuth-Morris-Pratt: string pattern matching in O(n+m). Precomputes a failure function (prefix table) that tells how far to backtrack on a mismatch. Avoids restarting from scratch like naive O(n×m) matching.',tag:'strings',label:'Strings'},
  {q:'What is a rolling hash (Rabin-Karp)?',a:'Hash a sliding window of length k in O(1) per slide using: hash = (hash * base + new_char - old_char * base^k) % MOD. Used for multi-pattern search and finding duplicate substrings. O(n) average but O(n²) worst case on hash collisions.',tag:'strings',label:'Strings'},
  {q:'What is Manacher\'s algorithm?',a:'Finds all palindromic substrings in O(n) by expanding around each center using previously computed palindrome radii. Transforms the string to insert separators (#a#b#a#) to handle even-length palindromes uniformly.',tag:'strings',label:'Strings'},
  {q:'How do you check if two strings are anagrams?',a:'Sort both and compare: O(n log n). Count characters with Counter and compare: O(n). Fixed-size alphabet: use a count array of size 26, increment for s, decrement for t, check all zeros.',tag:'strings',label:'Strings'},
  {q:'What are Python string operations and their complexities?',a:'s[i]: O(1). s[i:j] (slice): O(k) — creates a copy. s + t: O(n+m) — creates new string. "".join(list): O(total chars) — ALWAYS use join for building strings, not +=. s.split(): O(n). s.find(t): O(n×m) naive.',tag:'strings',label:'Strings'},
  {q:'How do you find all anagram occurrences in a string?',a:'Sliding window of length len(p). Maintain a frequency count of the window. Compare to the pattern frequency (Counter). Slide by adding arr[right] and removing arr[left]. O(n) total — each element added and removed once.',tag:'strings',label:'Strings'},

  // ── Complexity ────────────────────────────────
  {q:'What is amortized O(1) — give an example.',a:'An operation that is occasionally expensive but cheap on average across many calls. Example: Python list append is O(1) amortized — it doubles capacity on resize (O(n)) but that cost is spread over n future appends, averaging O(1) per append.',tag:'complexity',label:'Complexity'},
  {q:'What is the Master Theorem?',a:'For recurrences T(n) = aT(n/b) + f(n): Case 1: f(n) = O(n^(log_b(a)-ε)) → T(n) = Θ(n^log_b(a)). Case 2: f(n) = Θ(n^log_b(a)) → T(n) = Θ(n^log_b(a) log n). Case 3: f(n) = Ω(n^(log_b(a)+ε)) → T(n) = Θ(f(n)).',tag:'complexity',label:'Complexity'},
  {q:'Why is heapsort O(n log n)?',a:'Build heap: O(n) via heapify. Extract min/max n times: each extraction is O(log n). Total: O(n) + O(n log n) = O(n log n). Unlike mergesort it\'s in-place O(1) space, but in practice slower due to poor cache behavior.',tag:'complexity',label:'Complexity'},
  {q:'Why is quicksort O(n log n) average but O(n²) worst case?',a:'Average: random pivot splits array ~evenly → O(log n) levels × O(n) per level. Worst: pivot always min or max (sorted input) → O(n) levels × O(n) per level. Fix: random pivot or median-of-3. Quicksort is O(log n) space (stack frames).',tag:'complexity',label:'Complexity'},
  {q:'What is the time complexity of Python\'s list?',a:'append/pop: O(1) amortized. pop(0)/insert(0): O(n) — shifts all elements. index access: O(1). slice [i:j]: O(k). in operator: O(n). sort: O(n log n). Use deque for O(1) popleft. Use set/dict for O(1) membership.',tag:'complexity',label:'Complexity'},
  {q:'What are the complexities of heapq operations?',a:'heappush: O(log n). heappop: O(log n). heap[0] (peek): O(1). heapify (build from list): O(n) — NOT O(n log n). nlargest(k, it): O(n log k). nsmallest(k, it): O(n log k). heapreplace (pop then push): O(log n).',tag:'complexity',label:'Complexity'},
  {q:'What is the time complexity of DFS and BFS?',a:'Both O(V+E) on a graph. V = number of vertices visited, E = number of edges traversed. On a tree: O(n). The adjacency list representation is required for O(V+E) — adjacency matrix would be O(V²).',tag:'complexity',label:'Complexity'},
  {q:'What is the space complexity of recursive DFS?',a:'O(h) where h is the recursion depth (call stack frames). For a balanced tree: O(log n). For a skewed tree or graph DFS: O(n). Python\'s default recursion limit is ~1000 — mention this in interviews for deep trees, use iterative DFS instead.',tag:'complexity',label:'Complexity'},

  // ── System Design (basics) ────────────────────
  {q:'What is the CAP theorem?',a:'A distributed system can guarantee at most 2 of 3: Consistency (all nodes see same data), Availability (every request gets a response), Partition tolerance (system works despite network splits). Since network partitions happen, you choose between CP and AP.',tag:'design',label:'System Design'},
  {q:'What is consistent hashing?',a:'Maps both keys and servers to a ring. Each key is stored on the nearest clockwise server. Adding/removing a server only affects neighboring keys — not all keys. Used in distributed caches (Memcached, DynamoDB) to minimize re-distribution on scale.',tag:'design',label:'System Design'},
  {q:'What is the difference between SQL and NoSQL?',a:'SQL: relational, ACID, schema-enforced, good for complex joins, scales vertically. NoSQL: flexible schema, BASE, horizontally scalable, better for unstructured data, high throughput. Choose SQL for consistency; NoSQL for scale and flexibility.',tag:'design',label:'System Design'},
  {q:'What is an LRU cache and how do you implement it?',a:'Least Recently Used: evicts the least recently accessed item when full. Implementation: doubly linked list + hash map. List maintains recency order (O(1) move-to-front). Map gives O(1) access to any node. All ops O(1).',tag:'design',label:'System Design'},
  {q:'What is database sharding?',a:'Horizontal partitioning — splitting a database into smaller shards, each on a different server. Shard key determines which shard data goes to. Improves write throughput and storage capacity. Downside: cross-shard queries are expensive.',tag:'design',label:'System Design'},
  {q:'What is a load balancer?',a:'Distributes incoming requests across multiple servers to prevent any one from being overwhelmed. Strategies: round-robin, least connections, IP hash (sticky sessions). Also handles health checks and failover. Enables horizontal scaling.',tag:'design',label:'System Design'},

  // ── Misc / Python ─────────────────────────────
  {q:'How do you detect a cycle in a linked list?',a:'Floyd\'s cycle detection: fast pointer moves 2 steps, slow moves 1. If they meet, a cycle exists. To find the cycle start: reset one pointer to head; advance both 1 step at a time until they meet again. O(n) time, O(1) space.',tag:'misc',label:'Linked Lists'},
  {q:'How do you reverse a linked list in-place?',a:'Three pointers: prev=None, curr=head. Each iteration: save curr.next, set curr.next=prev, advance both. Return prev (new head). O(n) time, O(1) space. For recursive: recursively reverse the rest, then attach current node.',tag:'misc',label:'Linked Lists'},
  {q:'Stack vs queue — what are they used for?',a:'Stack: LIFO — DFS, undo history, balanced parentheses, call stack, monotonic problems. Queue: FIFO — BFS, task scheduling, level-order traversal. Python: use list for stack (append/pop), deque for queue (append/popleft).',tag:'misc',label:'Data Structures'},
  {q:'What is the backtracking framework?',a:'Three steps per recursive call: (1) CHOOSE — add a candidate to the current path. (2) EXPLORE — recurse. (3) UNCHOOSE — remove it (undo). Always append a COPY to results: results.append(list(current)), not results.append(current).',tag:'misc',label:'Backtracking'},
  {q:'When should you use DFS vs BFS for path problems?',a:'BFS: always for shortest path in unweighted graphs — guarantees minimum depth. DFS: all paths, existence of path, backtracking/exhaustive search. DFS is O(h) space; BFS is O(w) space. BFS can be slower due to queue overhead on deep graphs.',tag:'misc',label:'Pattern ID'},
  {q:'What is the difference between greedy and DP?',a:'Greedy makes a locally optimal choice at each step and never reconsiders. DP considers all subproblem solutions. If greedy is correct (provable by exchange argument or matroid theory), it\'s simpler and faster. DP is more general but more expensive.',tag:'misc',label:'Pattern ID'},
  {q:'When do you use defaultdict vs regular dict?',a:'defaultdict when you need a default value on first key access (int→0, list→[], set→set()). Regular dict when a missing key should raise KeyError (i.e., missing key is a bug). Both are O(1) average for all operations.',tag:'misc',label:'Python'},
  {q:'What Python tools are most useful for interviews?',a:'collections.Counter (frequency map), defaultdict (auto-default), deque (O(1) both ends), heapq (min-heap), sorted(key=...), bisect (binary search on sorted list), itertools (combinations, permutations, product). Know these cold.',tag:'misc',label:'Python'},
  {q:'What is a trie and when do you use it?',a:'A prefix tree where each path from root to a marked node spells a word. Insert/search/startsWith all O(m) where m = word length. Use when: autocomplete, prefix matching, finding words with common prefix. Each node has a dict of children + is_end flag.',tag:'misc',label:'Trie'},
  {q:'What is quickselect?',a:'Partition-based algorithm for finding the kth smallest element. Like quicksort but only recurse into the partition containing the target index. Average O(n), worst O(n²). Convert kth largest to index: target = len(nums) - k.',tag:'misc',label:'Arrays'},
  {q:'What is the Boyer-Moore voting algorithm?',a:'Find majority element (appears > n/2 times) in O(n) time, O(1) space. Maintain a candidate and count. Each time you see the candidate: count++. Different element: count--. When count hits 0: new candidate. The surviving candidate is the majority.',tag:'misc',label:'Arrays'},
  {q:'What is reservoir sampling?',a:'Select k items uniformly at random from a stream of unknown length n. For item i (1-indexed): keep it with probability k/i. If selected, replace a random one of the k currently kept items. Each item ends up with equal probability k/n.',tag:'misc',label:'Probability'},
];

function BigORef() {

  return (
    <div style={{marginBottom:'40px'}}>
      <div style={{fontSize:'13.5px',color:'#374151',lineHeight:'1.7',marginBottom:'20px'}}>
        Big O notation describes how the runtime (or space usage) of an algorithm <em>scales</em> as the input size n grows toward infinity. It expresses the <strong>upper bound on the growth rate</strong>, ignoring constants and lower-order terms. Two algorithms that both visit every element once are both O(n) — even if one does 3× more work per element.
      </div>

      <div className="ref-section-title" style={{marginBottom:'10px'}}>Complexity at a Glance</div>
      <div style={{overflowX:'auto',marginBottom:'28px'}}>
        <table className="bigo-complexity-table">
          <thead>
            <tr>
              <th>Complexity</th><th>Name</th>
              <th>n = 10</th><th>n = 100</th><th>n = 1,000</th><th>n = 1,000,000</th>
              <th>Verdict</th>
            </tr>
          </thead>
          <tbody>
            {BIGO_COMPLEXITIES.map((c,i) => (
              <tr key={c.notation}>
                <td><span className="bigo-chip" style={{background:c.bc,color:c.bt}}>{c.notation}</span></td>
                <td style={{fontWeight:'600',color:'#374151'}}>{c.name}</td>
                {Object.values(c.n).map((v,j) => <td key={j}>{v}</td>)}
                <td style={{fontSize:'11px',color:i<=1?'#059669':i<=3?'#D97706':i<=4?'#DC2626':'#7C3AED',fontWeight:'600'}}>
                  {i===0?'Ideal':i===1?'Excellent':i===2?'Good':i===3?'Acceptable':i===4?'Slow — optimize':i===5?'Impractical':'Never brute force'}
                </td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>

      <div className="ref-section-title" style={{marginBottom:'12px'}}>Each Complexity — In Depth</div>
      <p style={{fontSize:'12.5px',color:'var(--muted)',marginBottom:'14px'}}>Click any row to expand the explanation and annotated code example.</p>
      {BIGO_COMPLEXITIES.map((c,i) => (
        <div key={c.notation} className="bigo-card">
          <div className="bigo-header" onClick={() => toggle(i)}>
            <div className="bigo-header-left">
              <div className="bigo-title-row">
                <span className="bigo-chip" style={{background:c.bc,color:c.bt}}>{c.notation}</span>
                <span className="bigo-name">{c.name}</span>
                <span className="bigo-scale">{c.scale}</span>
              </div>
              <div style={{display:'flex',gap:'6px',flexWrap:'wrap',marginTop:'4px'}}>
                {c.examples.slice(0,3).map((ex,j) => (
                  <span key={j} className="bigo-example-pill">{ex}</span>
                ))}
              </div>
            </div>
            <span className="ds-toggle">{openIdx===i?'▲':'▼'}</span>
          </div>
          {openIdx===i && (
            <div className="bigo-body">
              <div className="bigo-desc">{c.desc}</div>
              <div className="ds-section-label">Code example</div>
              <AnnotatedCode lines={c.code.filter(l => l.c !== '')} />
            </div>
          )}
        </div>
      ))}

      <div className="ref-section-title" style={{margin:'28px 0 12px'}}>Rules for Simplification</div>
      <p style={{fontSize:'12.5px',color:'var(--muted)',marginBottom:'14px'}}>Apply these in order to get the final Big O from raw analysis.</p>
      <div className="bigo-rules-grid">
        {BIGO_RULES.map(r => (
          <div key={r.title} className="bigo-rule">
            <div className="bigo-rule-title">{r.title}</div>
            <div className="bigo-rule-body">{r.body}</div>
            <code className="bigo-rule-example">{r.ex}</code>

        ))}
      </div>

      <div className="ref-section-title" style={{margin:'28px 0 12px'}}>Data Structure + Operation Cheat Sheet</div>
      <div style={{border:'var(--border)',borderRadius:'var(--radius)',overflow:'hidden',marginBottom:'8px'}}>
        <table className="bigo-ds-table">
          <thead><tr><th>Structure</th><th>Operation</th><th>Time</th><th>Space (extra)</th><th>Notes</th></tr></thead>
          <tbody>
            {BIGO_DS.map((row,i) => (
              <tr key={i}>
                <td style={{fontWeight:'600',color:'#374151'}}>{row.ds}</td>
                <td>{row.op}</td>
                <td style={{color: row.time.includes('O(1)')&&!row.time.includes('O(1)*')?'#059669': row.time.includes('log')?'#2563EB': row.time.includes('O(n²)')||row.time.includes('O(n!)')?'#DC2626':'#374151', fontWeight:'600'}}>{row.time}</td>
                <td>{row.space}</td>
                <td style={{fontSize:'11.5px',color:'var(--muted)'}}>{row.note}</td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>

      <div className="ref-section-title" style={{margin:'28px 0 12px'}}>Space Complexity</div>
      <p style={{fontSize:'13px',color:'#4b5563',lineHeight:'1.65',marginBottom:'14px'}}>
        Space complexity measures <strong>auxiliary space</strong> — extra memory used beyond the input. The call stack counts: each recursive call frame uses space. Always state space complexity alongside time in interviews.
      </p>
      {BIGO_SPACE.map(s => (
        <div key={s.notation} className="bigo-space-item">
          <div className="bigo-space-row">
            <span className="bigo-space-notation">{s.notation}</span>
            <span style={{fontWeight:'600',color:'#374151',fontSize:'13px',marginRight:'8px'}}>{s.label}</span>
            <span className="bigo-space-text">{s.desc}</span>
          </div>
        </div>
      ))}

      <div className="ref-section-title" style={{margin:'28px 0 12px'}}>Best / Average / Worst Case</div>
      <div style={{display:'flex',flexDirection:'column',gap:'8px'}}>
        {[
          {label:'Best case Ω(n)', color:'#D1FAE5', textColor:'#065F46', desc:'The minimum operations needed — usually when the algorithm gets lucky (e.g., target is the first element in linear search: Ω(1)). Rarely useful in practice.'},
          {label:'Average case Θ(n)', color:'#FEF9C3', textColor:'#713F12', desc:'Expected performance over all inputs. Quicksort is Θ(n log n) average with a random pivot. What people usually mean when they say "O(n log n)" for quicksort.'},
          {label:'Worst case O(n)', color:'#FEE2E2', textColor:'#991B1B', desc:'Maximum operations for any input of size n. What Big O usually refers to in interviews. Quicksort is O(n²) worst case (sorted input, bad pivot). Guarantees an upper bound — the algorithm will never be slower than this.'},
        ].map(c => (
          <div key={c.label} style={{display:'flex',gap:'10px',padding:'10px 14px',background:'#fff',border:'var(--border)',borderRadius:'6px',alignItems:'flex-start'}}>
            <span style={{fontFamily:"'Fira Code',monospace",fontSize:'12px',fontWeight:'700',background:c.color,color:c.textColor,padding:'2px 8px',borderRadius:'4px',whiteSpace:'nowrap',flexShrink:0}}>{c.label}</span>
            <span style={{fontSize:'13px',color:'#4b5563',lineHeight:'1.6'}}>{c.desc}</span>
          </div>
        ))}
      </div>
    </div>
  );
}

function getTodayDayNum() {
  const now = new Date();
  now.setHours(0,0,0,0);
  const diff = Math.floor((now - PLAN_START) / (1000 * 60 * 60 * 24));
  if (diff < 0 || diff >= PLAN_LENGTH) return null;
  return diff + 1;
}

function pad(n) { return String(n).padStart(2,'0'); }

function formatCountdown(ms) {
  if (ms <= 0) return { str:'00:00:00:00', done:true };
  const total = Math.floor(ms / 1000);
  const days = Math.floor(total / 86400);
  const hrs  = Math.floor((total % 86400) / 3600);
  const mins = Math.floor((total % 3600) / 60);
  const secs = total % 60;
  return { str:`${pad(days)}d ${pad(hrs)}h ${pad(mins)}m ${pad(secs)}s`, days, hrs, mins, secs, total, done:false };
}

function getCountdownMsg(info) {
  if (!info || info.done) return 'Interview day — go get it.';
  if (info.days >= 9) return 'Work the plan.';
  if (info.days >= 3) return 'Focus on mocks.';
  if (info.days >= 1) return 'One mock, then rest.';
  return 'Stop cramming — breathe.';
}

// ── Time estimate helpers ───────────────────────────────────
function parseDur(d) {
  if (!d || d === '—') return 0;
  if (d.endsWith('h')) return parseFloat(d) || 0;
  if (d.endsWith('m')) return parseInt(d, 10) / 60;
  return 0;
}
function dayTotalHours(day) {
  return day.schedule.reduce((sum, s) => sum + parseDur(s.d), 0);
}
function dayHoursLabel(day) {
  const h = dayTotalHours(day);
  return h > 0 ? `~${h % 1 === 0 ? h : h.toFixed(1)}h` : '';
}

// ── Email generators ────────────────────────────────────────
function buildTodayEmail(dayNum) {
  const day = DAYS[dayNum - 1];
  const probs = PROBLEMS.filter(p => p.day === dayNum);
  const lines = [
    `📚 DS&A Study — Day ${dayNum} of 30`,
    `Date: ${day.date}  |  Topic: ${day.title}`,
    `Estimated time: ${dayHoursLabel(day)}`,
    ``,
    `TOPICS: ${day.topics.join(' · ')}`,
    ``,
    `SCHEDULE`,
    ...day.schedule.map(s => `  ${s.p.padEnd(12)} ${s.t}  (${s.d})`),
  ];
  if (probs.length) {
    lines.push(``, `PROBLEMS`);
    probs.forEach(p => lines.push(`  • ${p.title} [${p.diff}] — ${p.pat}`));
  }
  lines.push(``, `---`, `Powered by your 30-Day DS&A Plan`);
  return lines.join('\n');
}

function buildWeekEmail(week) {
  const start = (week - 1) * 7 + 1;
  const end = Math.min(week * 7, 30);
  const totalH = DAYS.slice(start-1, end).reduce((s, d) => s + dayTotalHours(d), 0);
  const lines = [
    `📚 DS&A Study — Week ${week} Plan (Days ${start}–${end})`,
    `Total estimated time: ~${totalH.toFixed(0)} hours`,
    ``,
  ];
  for (let i = start; i <= end; i++) {
    const d = DAYS[i-1];
    lines.push(`Day ${d.num} (${d.date}): ${d.title}  ${dayHoursLabel(d)}`);
    lines.push(`  Topics: ${d.topics.join(', ')}`);
    d.schedule.forEach(s => lines.push(`    ${s.p}: ${s.t} (${s.d})`));
    lines.push('');
  }
  lines.push('---', 'Powered by your 30-Day DS&A Plan');
  return lines.join('\n');
}

function buildFullEmail() {
  const totalH = DAYS.reduce((s, d) => s + dayTotalHours(d), 0);
  const lines = [
    '30-DAY DS&A PROFESSIONAL STUDY PLAN',
    '='.repeat(38),
    `Total estimated commitment: ~${totalH.toFixed(0)} hours over 30 days`,
    '',
  ];
  const weekLabels = ['Week 1: Arrays, Strings, Hash Maps','Week 2: Linked Lists, Stacks, Trees','Week 3: Graphs, Binary Search, Heaps','Week 4: DP, Backtracking, Advanced'];
  [1,2,3,4].forEach(w => {
    const start = (w-1)*7+1, end = Math.min(w*7,30);
    const wh = DAYS.slice(start-1,end).reduce((s,d) => s + dayTotalHours(d), 0);
    lines.push(weekLabels[w-1] + `  (~${wh.toFixed(0)}h)`, '-'.repeat(36));
    for (let i = start; i <= end; i++) {
      const d = DAYS[i-1];
      lines.push(`Day ${String(d.num).padStart(2,' ')} (${d.date}): ${d.title}  ${dayHoursLabel(d)}`);
      lines.push(`  Topics: ${d.topics.join(', ')}`);
    }
    lines.push('');
  });
  return lines.join('\n');
}

function openEmail(subject, body) {
  const url = `mailto:?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
  window.open(url, '_blank');
}

function copyText(text) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    return navigator.clipboard.writeText(text);
  }
  // file:// fallback
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.cssText = 'position:fixed;opacity:0;top:0;left:0';
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand('copy'); } catch(e) {}
  document.body.removeChild(ta);
  return Promise.resolve();
}

  'Foundation — Arrays, Strings, Hashing',
  'Data Structures — Lists, Stacks, Trees',
  'Graphs, Binary Search, Heaps',
  'Dynamic Programming, Backtracking, Advanced',
  'Advanced Graphs — Dijkstra, MST, SCC',
